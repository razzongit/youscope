    if (!insights) return;
    const card = h('div', { class: 'card' });
    card.appendChild(h('div', { class: 'card-head' },
      `<h3>Built-in reading</h3><span class="sub">computed on your device</span>`));
    const narr = h('div', { class: 'narr' });
    insights.sections.forEach(s => {
      narr.appendChild(h('div', { style: 'margin-bottom:22px' },
        `<div class="eyebrow" style="margin-bottom:8px">${esc(s.title)}</div><p>${md(s.body)}</p>`));
    });
    card.appendChild(narr);
    container.appendChild(card);
  }

  /* ───────────────── key form (shared) ───────────────── */
  function keyForm(ctx, onSubmit, label) {
    const cfg = ctx.aiCfg || {};
    const presetId = cfg.provider || 'openrouter';
    const preset = window.YSAI.PRESETS[presetId] || window.YSAI.PRESETS.openrouter;

    const card = h('div', { class: 'card' });
    card.innerHTML = `
      <div class="grid g-3" style="gap:12px">
        <div class="field">
          <label>Provider</label>
          <select class="input" data-f="provider">
            ${Object.entries(window.YSAI.PRESETS).map(([id, pr]) =>
              `<option value="${id}" ${id === presetId ? 'selected' : ''}>${esc(pr.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Model</label>
          <input class="input" data-f="model" list="m-${presetId}" placeholder="${esc(preset.model)}" value="${esc(cfg.model || '')}">
          <datalist id="m-${presetId}">${(preset.freeModels || []).map(m => `<option value="${esc(m)}">`).join('')}</datalist>
        </div>
        <div class="field">
          <label>API key</label>
          <input class="input" data-f="key" type="password" placeholder="${preset.noKey ? 'not needed' : 'paste key'}" value="${esc(cfg.apiKey || '')}">
        </div>
      </div>
      <div class="field" data-f="base-wrap" style="margin-top:10px;${presetId === 'custom' ? '' : 'display:none'}">
        <label>Base URL</label>
        <input class="input" data-f="base" value="${esc(cfg.baseUrl || '')}" placeholder="https://…/v1">
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button class="btn" data-f="run">${esc(label)}</button>
        <button class="btn ghost" data-f="test">Test connection</button>
        <span class="hint" data-f="hint">${esc(preset.note)}${preset.keysUrl ? ` · <a class="link" href="${esc(preset.keysUrl)}" target="_blank" rel="noopener">get a key</a>` : ''}</span>
      </div>
      <div data-f="roster"></div>
      <div data-f="prog"></div>
      ${window.YSAI.isFileProtocol() ? `<div class="hint" style="margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,196,107,.32);background:rgba(255,196,107,.06);color:var(--amber);line-height:1.6">
        <b>You opened this from a file.</b> Browsers block API calls from <code style="font-family:var(--mono)">file://</code> pages — that is a security rule, not a bug in your key.
        To use a key, serve the folder: run <code style="font-family:var(--mono)">python3 -m http.server 8000</code> in the app folder and open <code style="font-family:var(--mono)">http://localhost:8000</code>.
        Everything else works fine as-is.
      </div>` : ''}`;

    const q = (sel) => card.querySelector(sel);
    q('[data-f="provider"]').addEventListener('change', (e) => {
      const pr = window.YSAI.PRESETS[e.target.value];
      q('[data-f="model"]').placeholder = pr.model;
      q('[data-f="model"]').value = '';
      q('[data-f="model"]').setAttribute('list', '');
      q('[data-f="hint"]').innerHTML = esc(pr.note) +
        (pr.keysUrl ? ` · <a class="link" href="${esc(pr.keysUrl)}" target="_blank" rel="noopener">get a key</a>` : '');
      q('[data-f="key"]').placeholder = pr.noKey ? 'not needed' : 'paste key';
      q('[data-f="base-wrap"]').style.display = (e.target.value === 'custom') ? '' : 'none';
      renderRoster(e.target.value);
    });

    // Show what the free roster actually is, straight from the shipped data.
    function renderRoster(provider) {
      const host = q('[data-f="roster"]');
      if (!host) return;
      if (provider !== 'openrouter' || !window.YSOR) { host.innerHTML = ''; return; }
      const models = window.YSOR.FREE_MODELS || [];
      host.innerHTML = `
        <div style="margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.015)">
          <div class="mono" style="font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:9px">
            Free models that exist right now
          </div>
          <div class="list">
            ${models.map(m => `
              <div class="row" style="grid-template-columns:1fr auto;padding:5px 0;font-size:.78rem">
                <span><code style="font-family:var(--mono);font-size:.72rem;color:var(--accent)">${esc(m.id)}</code>
                  <span class="dim" style="margin-left:6px">${esc(m.note || '')}</span></span>
                <span class="meta">${m.json ? 'JSON' : 'no JSON'}</span>
              </div>`).join('')}
          </div>
          <div class="hint" style="margin-top:10px;line-height:1.6">
            The free roster changes without notice — that is why the default is
            <code style="font-family:var(--mono)">openrouter/free</code>, an auto-router that picks
            from whatever is live. Leave the model field blank to use it.
          </div>
        </div>`;
    }
    renderRoster(presetId);

    // Read + validate the form. Returns {ok, cfg, error}.
    function readForm() {
      const provider = q('[data-f="provider"]').value;
      const presetNow = window.YSAI.PRESETS[provider];
      const cfgOut = {
        provider,
        model: q('[data-f="model"]').value.trim(),
        apiKey: q('[data-f="key"]').value.trim(),
        baseUrl: q('[data-f="base"]').value.trim(),
      };
      const isCustom = provider === 'custom';
      if (isCustom) {
        if (!cfgOut.baseUrl) {
          return { ok: false, error: 'Custom endpoint needs a base URL — for example https://api.together.xyz/v1 or http://localhost:11434/v1' };
        }
        if (!/^https?:\/\//i.test(cfgOut.baseUrl) && !/^[\w.-]+(:\d+)?(\/|$)/.test(cfgOut.baseUrl)) {
          return { ok: false, error: 'That base URL does not look valid. It should start with https:// (or http:// for a local server).' };
        }
      }
      if (!cfgOut.model && !presetNow.model && !isCustom) {
        return { ok: false, error: 'Pick a model — the provider needs to know which one.' };
      }
      if (isCustom && !cfgOut.model) {
        return { ok: false, error: 'Type the model id your endpoint expects. A custom server cannot guess it — for a local Ollama that might be "llama3.2"; for Together it looks like "meta-llama/Llama-3.3-70B-Instruct-Turbo".' };
      }
      if (!cfgOut.apiKey && !presetNow.noKey && !isCustom) {
        return { ok: false, error: 'Add an API key — or switch to Ollama to run it locally with no key.' };
      }
      return { ok: true, cfg: cfgOut };
    }

    function showFormError(msg) {
      q('[data-f="prog"]').innerHTML = `<div class="state err" style="padding:12px;margin-top:12px">
        <p class="muted" style="font-size:.85rem;line-height:1.6">${esc(msg)}</p></div>`;
    }

    q('[data-f="run"]').addEventListener('click', () => {
      const v = readForm();
      if (!v.ok) return showFormError(v.error);
      window.YSAI.saveConfig(v.cfg);
      ctx.aiCfg = v.cfg;
      onSubmit(v.cfg, q('[data-f="run"]'), q('[data-f="prog"]'));
    });

    // Test connection: one tiny call, reports exactly what came back.
    q('[data-f="test"]').addEventListener('click', async () => {
      const v = readForm();
      if (!v.ok) return showFormError(v.error);
      const btn = q('[data-f="test"]');
      const prog = q('[data-f="prog"]');
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> testing';
      prog.innerHTML = '';
      const t0 = performance.now();
      try {
        const r = await window.YSAI.chat(v.cfg, [
          { role: 'user', content: 'Reply with exactly: OK' },
        ], { maxTokens: 12, temperature: 0, json: false, timeoutMs: 45000 });
        const ms = Math.round(performance.now() - t0);
        prog.innerHTML = `<div style="padding:12px 14px;margin-top:12px;border-radius:8px;
            border:1px solid rgba(125,255,179,.4);background:rgba(125,255,179,.07)">
          <div style="color:var(--accent);font-family:var(--mono);font-size:.78rem;letter-spacing:.06em">CONNECTED · ${ms}ms</div>
          <div class="hint" style="margin-top:6px">Model replied: <b>${esc(String(r.content).slice(0, 80))}</b>
          · resolved model <code style="font-family:var(--mono)">${esc(r.model || v.cfg.model)}</code></div>
        </div>`;
        window.YSAI.saveConfig(v.cfg);
        // On OpenRouter, also report the key's real limits so a long run is safe.
        if (v.cfg.provider === 'openrouter' && window.YSAI.checkOpenRouterKey) {
          try {
            const info = await window.YSAI.checkOpenRouterKey(v.cfg.apiKey, v.cfg.baseUrl);
            if (info) {
              const daily = info.freeModelDaily
                ? `${info.freeModelDaily.remaining}/${info.freeModelDaily.limit} free requests left today`
                : 'no free-model counter reported';
              const tier = info.isFreeTier ? 'free tier' : 'credited account';
              prog.innerHTML += `<div class="hint" style="margin-top:8px;padding:8px 12px;border-radius:8px;
                  background:rgba(255,255,255,.03);border:1px solid var(--line)">
                ${esc(tier)} · ${esc(daily)}${info.limitRemaining !== null && info.limitRemaining !== undefined
                  ? ' · $' + Number(info.limitRemaining).toFixed(2) + ' credit left' : ''}
              </div>`;
            }
          } catch (e2) { /* non-fatal */ }
        }
      } catch (e) {
        prog.innerHTML = `<div class="state err" style="padding:14px;margin-top:12px">
          <div style="color:var(--coral);font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;margin-bottom:8px">CONNECTION FAILED</div>
          <p class="muted" style="font-size:.82rem;line-height:1.65">${esc(e.message)}</p>
          <p class="hint" style="margin-top:10px">Things to check: is the base URL right (it usually ends in <code>/v1</code>)? Is the model id exact? Does this provider allow browser calls?</p>
        </div>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Test connection';
      }
    });

    return card;
  }

  function setBusy(btn, prog, text) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> ' + esc(text || 'working…');
    prog.innerHTML = '';
  }
  function setDone(btn, label) { btn.disabled = false; btn.textContent = label; }
  function showError(prog, msg) {
    prog.innerHTML = `<div class="state err" style="padding:14px;margin-top:12px">
      <h3 style="font-size:.95rem">${esc(String(msg).split('—')[0] || 'Failed')}</h3>
      <p class="muted" style="font-size:.8rem">${esc(msg)}</p></div>`;
  }

  /* ───────────────── personalised (no hardcoded categories) ───────────────── */
  function renderPersonalPanel(panel, out, ctx) {
    const data = ctx.data;
    const hasEvents = !!data && Array.isArray(data.watch) && data.watch.length > 0;

    if (!hasEvents) {
      panel.appendChild(h('div', {
        class: 'card', style: 'border-color:rgba(255,196,107,.34);background:rgba(255,196,107,.05)',
      }, `<div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-size:1.3rem;line-height:1;color:var(--amber)">!</span>
        <div>
          <div style="font-family:var(--serif);font-size:1.2rem;margin-bottom:6px">Drop your zip again</div>
          <div class="hint" style="color:var(--text-mid);line-height:1.65">
            This mode clusters your individual videos, and those are deliberately not kept
            between page loads. Re-open your zip and the analysis will already be here.
          </div>
        </div></div>`));
      return;
    }

    // local preview of the clusters — free, instant, before any API call
    // Prefer what the upload pipeline already computed — clustering is 1.3s
    // and there is no reason to do it twice.
    let facts = ctx.facts || null;
    let clustered = ctx.clusters || null;
    if (!facts || !clustered) {
      try {
        const tz = (ctx.profile.timezone && ctx.profile.timezone.offsetMin) || 0;
        facts = facts || window.YSFacts.build(data, { tzOffsetMin: tz });
        if (facts && !facts.eras) facts.eras = window.YSFacts.eras(facts, data.watch);
        clustered = clustered || window.YSCluster.build(data.watch, { maxClusters: 18 });
      } catch (e) { /* surfaced below */ }
    }

    if (!clustered || !clustered.clusters.length) {
      panel.appendChild(h('div', { class: 'card' },
        `<div class="hint">Could not cluster this history — it may be too small. Try Digest instead.</div>`));
      return;
    }

    const info = h('div', { class: 'card', style: 'border-color:rgba(125,255,179,.2)' });
    info.innerHTML = `
      <div class="card-head"><h3>What it will do</h3><span class="sub">free until you press the button</span></div>
      <div class="hint" style="line-height:1.75;color:var(--text-mid)">
        Your viewing was grouped into <b>${clustered.clusters.length} clusters</b> by shared vocabulary —
        no preset categories, nothing named yet. The model will name these in <em>your</em> words,
        then choose what is worth saying and write it.
        <br><br>
        <b style="color:var(--accent)">Sends:</b> cluster vocabulary, example titles, and the computed fact sheet.
        Roughly 5 calls.
      </div>`;

    const list = h('div', { class: 'list', style: 'margin-top:14px' });
    clustered.clusters.slice(0, 10).forEach((c) => {
      list.appendChild(h('div', {
        class: 'row', style: 'grid-template-columns:1fr auto;gap:12px;padding:7px 0',
      }, `<span style="font-size:.82rem"><b>${esc(c.terms.slice(0, 5).join(', '))}</b>
            <span class="dim" style="margin-left:6px">${esc(c.channels.slice(0, 3).join(', '))}</span></span>
          <span class="meta">${c.count}</span>`));
    });
    info.appendChild(list);
    if (clustered.clusters.length > 10) {
      info.appendChild(h('div', { class: 'hint', style: 'margin-top:8px' },
        `…and ${clustered.clusters.length - 10} more clusters.`));
    }
    if (facts) {
      info.appendChild(h('div', { class: 'hint', style: 'margin-top:14px;padding-top:12px;border-top:1px solid var(--line);line-height:1.7' },
        `${facts.totalWatched.toLocaleString()} watches · ${facts.channels.toLocaleString()} channels · ` +
        `${facts.eras.length} eras detected · ${facts.longReturns.length} channels returned after long gaps · ` +
        `${facts.abandoned.length} went quiet`));
    }
    panel.appendChild(info);

    const form = keyForm(ctx, async (cfg, btn, prog) => {
      setBusy(btn, prog, 'starting');
      out.innerHTML = '';

      const live = h('div', { class: 'card', style: 'margin-top:16px' });
      live.innerHTML = `
        <div class="card-head"><h3>Working</h3><span class="sub" id="p-stage">starting…</span></div>
        <div class="bar" style="margin-bottom:14px"><i id="p-bar" style="width:3%"></i></div>
        <div class="list" id="p-list"></div>`;
      out.appendChild(live);
      const stageEl = live.querySelector('#p-stage');
      const barEl = live.querySelector('#p-bar');
      const listEl = live.querySelector('#p-list');

      try {
        const result = await window.YSPersonalize.run(facts, clustered.clusters, cfg, {
          delayMs: 300,
          onStage: (s) => {
            stageEl.textContent = s;
            listEl.appendChild(h('div', { class: 'hint', style: 'padding:3px 0' }, '→ ' + esc(s)));
            barEl.style.width = Math.min(95, 10 + listEl.children.length * 18) + '%';
          },
        });
        barEl.style.width = '100%';
        stageEl.textContent = 'done';
        const done = h('div', { style: 'margin-top:16px' });
        renderPersonalResult(done, result, ctx);
        out.appendChild(done);
        // Hand the model's grouping to the app so the charts rebuild on it.
        if (ctx.onPersonalized) ctx.onPersonalized(result);
      } catch (e) {
        showError(prog, e.message);
        if (!listEl.children.length) live.remove();
      } finally {
        setDone(btn, 'Run personalised analysis');
      }
    }, 'Run personalised analysis');
    panel.appendChild(form);

    // Arriving from the upload gate with "Personalised" already chosen: start
    // immediately rather than making the user press a second button.
    if (ctx.autorun === 'personal') {
      setTimeout(() => {
        const btn = form.querySelector('[data-f="run"]');
        if (btn) btn.click();
      }, 120);
    }
  }

  function renderPersonalResult(container, res, outerCtx) {
    if (res.headline) {
      container.appendChild(h('div', { class: 'card' },
        `<div style="font-family:var(--serif);font-size:1.5rem;line-height:1.3;letter-spacing:-.01em">
          ${esc(res.headline)}</div>
         ${res.noticed ? `<div class="hint" style="margin-top:12px">${esc(res.noticed)}</div>` : ''}`));
    }

    const tax = h('div', { class: 'card', style: 'margin-top:14px' });
    tax.appendChild(h('div', { class: 'card-head' },
      `<h3>Your interests, in your own terms</h3><span class="sub">named from your vocabulary</span>`));
    res.taxonomy.forEach((t) => {
      const row = h('div', { style: 'padding:11px 0;border-bottom:1px solid var(--line)' });
      row.innerHTML = `
        <div style="display:flex;align-items:baseline;gap:10px">
          <strong style="font-size:.95rem">${esc(t.name)}</strong>
          <span class="mono" style="margin-left:auto;font-size:.75rem;color:var(--accent)">${t.share}%</span>
        </div>
        <div class="hint" style="margin-top:5px;line-height:1.6">${esc(t.definition || '')}</div>
        ${t.channels.length ? `<div class="tags" style="margin-top:7px">${t.channels.slice(0, 4)
          .map(c => `<span class="tag">${esc(c)}</span>`).join('')}</div>` : ''}`;
      tax.appendChild(row);
    });
    container.appendChild(tax);

    // Each section renders through the block library: prose plus whatever
    // visuals the model chose, validated against the fixed vocabulary.
    const blockCtx = {
      profile: ctx.profile, facts: ctx.facts || null,
      taxonomyGroups: res.taxonomy, body: '',
    };
    res.sections.forEach((s) => {
      const card = h('div', { class: 'card', style: 'margin-top:14px' });
      card.appendChild(h('div', { class: 'eyebrow', style: 'margin-bottom:10px' }, esc(s.title)));

      const inner = { ...blockCtx, body: s.body };
      if (window.YSBlocks) {
        card.appendChild(window.YSBlocks.renderSection(s, inner));
      } else {
        card.appendChild(h('p', { class: 'narr' }, esc(s.body)));
      }

      if (s.cites && s.cites.length) {
        card.appendChild(h('div', { class: 'hint', style: 'margin-top:12px;opacity:.55' },
          'evidence: ' + esc(s.cites.join(', '))));
      }
      container.appendChild(card);
    });

    if (res.failedSections && res.failedSections.length) {
      container.appendChild(h('div', { class: 'hint', style: 'margin-top:12px;color:var(--amber)' },
        `${res.failedSections.length} section(s) could not be written: ` +
        res.failedSections.map(f => esc(f.title)).join(', ')));
    }
    if (res.skipped) {
      container.appendChild(h('div', { class: 'card', style: 'margin-top:14px' },
        `<div class="card-head"><h3>What this report chose not to say</h3></div>
         <p class="narr">${esc(res.skipped)}</p>`));
    }
  }

  /* ───────────────── digest ───────────────── */
  function renderDigestPanel(panel, out, ctx) {
    panel.appendChild(h('div', {
      class: 'card', style: 'border-color:rgba(125,255,179,.2)',
    }, `<div class="hint" style="color:var(--text-mid)">
      <b style="color:var(--accent)">Sends:</b> category shares, hourly counts, quarter trajectories and top channel names.
      <b>Not sent:</b> any video titles, your searches, or your identity.
    </div>`));

    const form = keyForm(ctx, async (cfg, btn, prog) => {
      setBusy(btn, prog, 'thinking');
      try {
        const digest = window.YSInsights.buildDigest(ctx.profile);
        const res = await window.YSAI.analyze(digest, cfg, (stage) => {
          prog.innerHTML = `<div class="step" style="margin-top:10px">${esc(stage)}…</div>`;
        });
        prog.innerHTML = '';
        out.innerHTML = '';
        LAST = res;
        renderAiPortrait(out, res);
      } catch (e) {
        showError(prog, e.message);
      } finally {
        setDone(btn, 'Generate portrait');
      }
    }, 'Generate portrait');
    panel.appendChild(form);
  }

  /* ───────────────── full personal ───────────────── */
  function renderFullPanel(panel, out, ctx) {
    const p = ctx.profile;
    const data = ctx.data;
    const X = window.YSTaxonomy;
    const C = window.YSCorrelations;

    // Raw events are intentionally not persisted (sessionStorage holds aggregates
    // only). After a refresh, Full mode has nothing to sample from — say so
    // instead of silently producing an empty analysis.
    const hasEvents = !!data && Array.isArray(data.watch) && data.watch.length > 0;
    if (!hasEvents) {
      const card = h('div', { class: 'card', style: 'border-color:rgba(255,196,107,.34);background:rgba(255,196,107,.05)' });
      card.innerHTML = `
        <div style="display:flex;gap:12px;align-items:flex-start">
          <span style="font-size:1.3rem;line-height:1;color:var(--amber)">⚠</span>
          <div>
            <div style="font-family:var(--serif);font-size:1.15rem;margin-bottom:6px">Your videos are not in memory any more</div>
            <div class="hint" style="color:var(--text-mid);line-height:1.65">
              Full personal needs your individual video titles to analyse. Those are deliberately
              <b>not</b> saved between page loads — only the statistics are kept, so a refresh
              (or reopening the tab) discards them.
              <br><br>Drop your zip again to use this mode. <b>Digest</b> still works right now,
              because it only needs the statistics.
            </div>
          </div>
        </div>`;
      panel.appendChild(card);

      // Still offer digest here rather than a dead end
      const form = keyForm(ctx, async (cfg, btn, prog) => {
        setBusy(btn, prog, 'thinking');
        try {
          const digest = window.YSInsights.buildDigest(ctx.profile);
          const res = await window.YSAI.analyze(digest, cfg, (stage) => {
            prog.innerHTML = `<div class="step" style="margin-top:10px">${esc(stage)}…</div>`;
          });
          prog.innerHTML = '';
          out.innerHTML = '';
          LAST = res;
          renderAiPortrait(out, res);
        } catch (e) {
          showError(prog, e.message);
        } finally {
          setDone(btn, 'Generate portrait');
        }
      }, 'Run digest instead');
      panel.appendChild(form);
      return;
    }

    // ── what will be sent: exact preview ──
    let preview = null;
    try {
      preview = window.YSDeep.previewPayload(data, p, X, { perCategory: 24, maxCategories: 12 });
    } catch (e) { /* no raw data (restored session) */ }

    const warn = h('div', { class: 'card', style: 'border-color:rgba(255,196,107,.34);background:rgba(255,196,107,.05)' });
    warn.innerHTML = `
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-size:1.3rem;line-height:1;color:var(--amber)">⚠</span>
        <div>
          <div style="font-family:var(--serif);font-size:1.15rem;margin-bottom:6px">This mode sends your actual video titles</div>
          <div class="hint" style="color:var(--text-mid);line-height:1.6">
            Every other mode sends only statistics. This one sends <b>what you watched</b> — the real titles — because that is what makes the analysis specific instead of generic.
            It goes only to the provider you choose below, never to us. There is no server.
            <br><br>If you would rather not, use <b>Digest</b> instead: same structure, no titles.
          </div>
        </div>
      </div>`;

    if (preview) {
      const details = h('details', { style: 'margin-top:14px' });
      details.appendChild(h('summary', {
        style: 'cursor:pointer;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)',
      }, `See exactly what will be sent — ${preview.totals.titles} titles across ${preview.totals.categories} interests`));

      const inner = h('div', { style: 'margin-top:12px' });
      preview.categories.forEach(c => {
        const block = h('div', { style: 'margin-bottom:12px' });
        block.innerHTML = `<div class="mono" style="font-size:.72rem;color:var(--accent);margin-bottom:4px">${esc(c.label)} — ${c.total} titles</div>
          <div class="hint" style="font-size:.76rem;line-height:1.65">${c.titles.map(t => '· ' + esc(t)).join('<br>')}
          ${c.total > c.titles.length ? `<span class="dim">…and ${c.total - c.titles.length} more</span>` : ''}</div>`;
        inner.appendChild(block);
      });
      inner.appendChild(h('div', { class: 'hint', style: 'margin-top:10px;border-top:1px solid var(--line);padding-top:10px' },
        `Plus: ${preview.totals.calls} model calls total (${preview.totals.categories} per-interest + 1 synthesis).`));
      details.appendChild(inner);
      warn.appendChild(details);
    }
    panel.appendChild(warn);

    // ── cost note ──
    panel.appendChild(h('div', {
      class: 'card', style: 'margin-top:12px;border-color:rgba(125,255,179,.16)',
    }, `<div class="hint" style="color:var(--text-mid)">
      <b style="color:var(--accent)">Cost:</b> ${preview ? preview.totals.calls : '~13'} calls.
      On OpenRouter's free models that is <b>$0</b>, but free tiers rate-limit — if a call fails with 429 the run stops rather than burning your quota, and any interests already analysed are kept.
      For the best result use a 70B-class model or Gemini Flash.
    </div>`));

    // ── correlation preview (local, free) ──
    const corr = C.build(p, X);
    if (corr.pairs.length) {
      const cc = h('div', { class: 'card', style: 'margin-top:12px' });
      cc.appendChild(h('div', { class: 'card-head' },
        `<h3>Cross-interest findings</h3><span class="sub">computed locally, included in the analysis</span>`));
      const list = h('div', { class: 'list' });
      corr.pairs.slice(0, 5).forEach(pr => {
        list.appendChild(h('div', {
          class: 'row', style: 'grid-template-columns:1fr auto;gap:14px',
        }, `<span style="font-size:.84rem"><b>${esc(pr.aLabel)}</b> ${pr.direction} <b>${esc(pr.bLabel)}</b></span>
            <span class="meta" style="color:${pr.r > 0 ? 'var(--accent)' : 'var(--amber)'}">r=${pr.r}</span>`));
      });
      cc.appendChild(list);
      const tens = C.tensions(p);
      if (tens.length) {
        cc.appendChild(h('div', { class: 'hint', style: 'margin-top:14px;padding-top:12px;border-top:1px solid var(--line);line-height:1.7' },
          tens.slice(0, 3).map(t => '· ' + esc(t)).join('<br>')));
      }
      panel.appendChild(cc);
    }

    // ── run ──
    const form = keyForm(ctx, async (cfg, btn, prog) => {
      setBusy(btn, prog, 'starting');
      out.innerHTML = '';

      // live progress card
      const live = h('div', { class: 'card', style: 'margin-top:16px' });
      live.innerHTML = `
        <div class="card-head"><h3>Analysing</h3><span class="sub" id="deep-stage">starting…</span></div>
        <div class="bar" style="margin-bottom:14px"><i id="deep-bar" style="width:2%"></i></div>
        <div class="list" id="deep-list"></div>`;
      out.appendChild(live);
      const stageEl = live.querySelector('#deep-stage');
      const barEl = live.querySelector('#deep-bar');
      const listEl = live.querySelector('#deep-list');

      const rows = new Map();
      const markRow = (label, state, note) => {
        if (!rows.has(label)) {
          const r = h('div', { class: 'row', style: 'grid-template-columns:20px 1fr auto;font-size:.83rem' });
          rows.set(label, r); listEl.appendChild(r);
        }
        const r = rows.get(label);
        const icon = state === 'done' ? '✓' : state === 'run' ? '◌' : state === 'fail' ? '✕' : '·';
        const color = state === 'done' ? 'var(--accent)' : state === 'fail' ? 'var(--coral)' : state === 'run' ? 'var(--amber)' : 'var(--text-dim)';
        r.innerHTML = `<span style="color:${color}">${icon}</span>
          <span class="ttl" style="font-size:.83rem">${esc(label)}</span>
          <span class="meta">${esc(note || '')}</span>`;
      };

      try {
        const result = await window.YSDeep.analyzeFull(data, p, X, corr, cfg, {
          onStage: (s) => { stageEl.textContent = s; },
          onCategory: (i, total, label) => {
            stageEl.textContent = `interest ${i} of ${total}`;
            barEl.style.width = Math.round(4 + (i / total) * 88) + '%';
            markRow(label, 'run', '');
            // mark previous done lazily: recolored on next tick by result pass
            setTimeout(() => { if (rows.has(label)) markRow(label, 'run', 'analysing'); }, 0);
          },
        });

        // finalize rows from what actually came back
        listEl.innerHTML = '';
        rows.clear();
        (result.categories || []).forEach(c => {
          markRow(c.label, c.analysis ? 'done' : 'fail',
            c.analysis ? (c.analysis.subthemes || []).length + ' subthemes' : 'failed');
        });
        barEl.style.width = '100%';
        stageEl.textContent = 'done';
        FULL = result;

        const done = h('div', { style: 'margin-top:16px' });
        renderFullResult(done, result);
        out.appendChild(done);
      } catch (e) {
        showError(prog, e.message);
        if (!listEl.children.length) live.remove();
      } finally {
        setDone(btn, 'Run full analysis');
      }
    }, 'Run full analysis');
    panel.appendChild(form);
  }

  /* ───────────────── renderers ───────────────── */
  function renderAiPortrait(container, res) {
    const card = h('div', { class: 'card' });
    if (res.archetype || res.tagline) {
      card.appendChild(h('div', {
        style: 'border-left:2px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:20px',
      }, `${res.archetype ? `<div class="eyebrow" style="margin-bottom:7px;color:var(--accent)">${esc(res.archetype)}</div>` : ''}
          ${res.tagline ? `<div style="font-family:var(--serif);font-size:1.5rem;line-height:1.25">${esc(res.tagline)}</div>` : ''}`));
    }
    if (Array.isArray(res.keywords) && res.keywords.length) {
      const tags = h('div', { class: 'tags', style: 'margin-bottom:20px' });
      res.keywords.forEach(k => tags.appendChild(h('span', { class: 'tag hot' }, esc(k))));
      card.appendChild(tags);
    }
    (res.sections || []).forEach(s => {
      card.appendChild(h('div', { style: 'margin-bottom:20px' },
        `<div class="eyebrow" style="margin-bottom:7px">${esc(s.title)}</div><p class="narr">${md(s.body)}</p>`));
    });
    if (res.model) {
      card.appendChild(h('div', { class: 'hint', style: 'margin-top:10px;opacity:.7' },
        `Model: ${esc(res.model)}${res.usage && res.usage.total_tokens ? ' · ' + res.usage.total_tokens + ' tokens' : ''}`));
    }
    container.appendChild(card);
  }

  function renderFullResult(container, res) {
    // headline
    const head = h('div', { class: 'card' });
    if (res.archetype || res.tagline) {
      head.appendChild(h('div', {
        style: 'border-left:2px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:18px',
      }, `${res.archetype ? `<div class="eyebrow" style="margin-bottom:7px;color:var(--accent)">${esc(res.archetype)}</div>` : ''}
          ${res.tagline ? `<div style="font-family:var(--serif);font-size:1.6rem;line-height:1.22">${esc(res.tagline)}</div>` : ''}`));
    }
    if (Array.isArray(res.keywords) && res.keywords.length) {
      const tags = h('div', { class: 'tags' });
      res.keywords.forEach(k => tags.appendChild(h('span', { class: 'tag hot' }, esc(k))));
      head.appendChild(tags);
    }
    if (res.confidence) {
      head.appendChild(h('div', { class: 'hint', style: 'margin-top:14px' },
        `<b>Confidence:</b> ${esc(res.confidence)}`));
    }
    container.appendChild(head);

    // sections
    const body = h('div', { class: 'card', style: 'margin-top:14px' });
    (res.sections || []).forEach(s => {
      body.appendChild(h('div', { style: 'margin-bottom:22px' },
        `<div class="eyebrow" style="margin-bottom:7px">${esc(s.title)}</div><p class="narr">${md(s.body)}</p>`));
    });
    container.appendChild(body);

    // per-interest detail
    if (Array.isArray(res.categories) && res.categories.length) {
      const dc = h('div', { class: 'card', style: 'margin-top:14px' });
      dc.appendChild(h('div', { class: 'card-head' },
        `<h3>What each interest means to you</h3>
         <span class="sub">from ${res.stats ? res.stats.titlesSent : '?'} titles</span>`));
      const grid = h('div', { class: 'grid g-2', style: 'gap:14px' });
      res.categories.forEach(c => {
        if (!c.analysis) return;
        const a = c.analysis;
        const cc = h('div', {
          style: 'border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:rgba(255,255,255,.015)',
        });
        let sub = '';
        if (Array.isArray(a.subthemes)) {
          sub = `<div class="tags" style="margin-top:10px">${a.subthemes.slice(0, 5).map(s =>
            `<span class="tag" title="${esc(s.evidence || '')}">${esc(s.name)}</span>`).join('')}</div>`;
        }
        cc.innerHTML = `
          <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
            <h3 style="font-size:.9rem">${esc(c.label)}</h3>
            <span class="mono" style="margin-left:auto;font-size:.7rem;color:var(--text-dim)">${c.share}%</span>
          </div>
          <p style="font-size:.85rem;line-height:1.6;color:var(--text-mid)">${esc(a.essence || '')}</p>
          ${sub}
          ${a.gravitation ? `<div class="hint" style="margin-top:10px"><b>Pulls you back:</b> ${esc(a.gravitation)}</div>` : ''}
          ${a.tension ? `<div class="hint" style="margin-top:6px;color:var(--amber)"><b>Tension:</b> ${esc(a.tension)}</div>` : ''}
          ${a.changed ? `<div class="hint" style="margin-top:6px"><b>Shifted:</b> ${esc(a.changed)}</div>` : ''}`;
        grid.appendChild(cc);
      });
      dc.appendChild(grid);
      container.appendChild(dc);
    }

    if (res.stats) {
      container.appendChild(h('div', { class: 'hint', style: 'margin-top:12px;opacity:.7' },
        `${res.stats.categoriesAnalysed}/${res.stats.categoriesTotal} interests analysed · ${res.stats.titlesSent} titles · model ${esc(res.model || '')}
         ${res.usage && res.usage.total_tokens ? ' · ' + res.usage.total_tokens + ' tokens' : ''}`));
    }
  }

  root.YSportrait = { render };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>

 */
(function (root) {
  'use strict';

  const h = (tag, attrs, html) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'style') n.style.cssText = attrs[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }
    if (html !== undefined && html !== null) n.innerHTML = html;
    return n;
  };
  const esc = (s) => String(s === null || s === undefined ? '' : s)

      headers: { 'Content-Type': 'application/json' },

    });

  async function testConnection() {

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

        messages: [{ role: 'user', content: 'Reply with exactly: OK' }],
        maxTokens: 1200,
        temperature: null,
      }),
    });
    const j = await r.json().catch(() => ({ error: 'Bad response from server' }));
    return { ok: r.ok && j.content !== null, ...j, httpStatus: r.status };
  }

  /* Is this page running under server.mjs, or opened as a bare file? */
  function proxyMode() {
    // Resolve location defensively: UMD modules may be loaded into a window
    // where the bare `location` binding is not in scope.
    let loc = null;
    try {
      if (typeof location !== 'undefined' && location) loc = location;
      else if (typeof self !== 'undefined' && self.location) loc = self.location;
      else if (typeof window !== 'undefined' && window.location) loc = window.location;
    } catch (e) { return false; }
    if (!loc) return false;
    const p = String(loc.protocol || '');
    const hst = String(loc.hostname || '');
    return (p === 'http:' || p === 'https:') &&
      (hst === 'localhost' || hst === '127.0.0.1' || hst === '0.0.0.0');
  }

      saveBtn.innerHTML = '<span class="spin"></span> saving';
      statusEl.innerHTML = '';
      try {
        const saved = await saveConfig(payload);
        if (saved.error) throw new Error(saved.error);
        if (!saved.hasKey && !p.noKey && sel.value !== 'custom') {
          statusEl.innerHTML = `<div class="hint" style="color:var(--amber)">Saved, but no key is stored yet — paste one to use AI features.</div>`;
        }
        saveBtn.innerHTML = '<span class="spin"></span> testing';
        const t = await testConnection();
        if (t.ok) {
          statusEl.innerHTML = `<div style="padding:12px 14px;border-radius:8px;border:1px solid rgba(125,255,179,.4);
            background:rgba(125,255,179,.07)">
            <div style="color:var(--accent);font-family:var(--mono);font-size:.74rem;letter-spacing:.06em">
              CONNECTED${t.ms ? ' · ' + t.ms + 'ms' : ''}</div>
            <div class="hint" style="margin-top:6px">Model replied <b>${esc(String(t.content).slice(0, 40))}</b>
            · served by <code style="font-family:var(--mono)">${esc(t.model || payload.model)}</code></div>
          </div>`;
          if (onSaved) onSaved(saved);
        } else {
          throw new Error((t.hint ? t.hint + ' ' : '') + (t.error || t.emptyReason || 'Connection failed'));
        }
      } catch (e) {
        statusEl.innerHTML = `<div class="state err" style="padding:14px">
          <div style="color:var(--coral);font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;margin-bottom:8px">
            NOT CONNECTED</div>
          <p class="muted" style="font-size:.84rem;line-height:1.65">${esc(e.message)}</p>
        </div>`;
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save and test';
      }
    });

    // hydrate from server
    getConfig().then(cfg => {
      if (!cfg) return;
      const match = PROVIDERS.find(p => p.base && cfg.baseUrl &&
        cfg.baseUrl.replace(/\/+$/, '') === p.base.replace(/\/+$/, ''));
      sel.value = match ? match.id : 'custom';
      applyProvider(sel.value, true);
      baseIn.value = cfg.baseUrl || '';
      modelIn.value = cfg.model || '';
      maxIn.value = cfg.maxTokens || 8000;
      tempIn.value = cfg.temperature !== undefined ? cfg.temperature : 0.6;
      keyIn.value = '';
      keyIn.placeholder = cfg.hasKey ? 'a key is already saved — leave blank to keep it' : (match?.noKey ? 'not needed' : 'paste your key');
    });

    applyProvider('zai', null);
    container.appendChild(wrap);
  }

  root.YSsettings = { render, proxyMode, getConfig };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* YouScope — app.js
 * Orchestrates: upload → parse → analyze → render. No framework, no build step.
 */
(function () {
  'use strict';

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
  const h = (tag, attrs, html) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'style') n.style.cssText = attrs[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }
    if (html !== undefined && html !== null) n.innerHTML = html;
    return n;
  };
  const esc = (s) => String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fmt = (n) => {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (Math.abs(n) >= 1e4) return Math.round(n / 1e3) + 'k';
    if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n * 10) / 10 % 1 === 0 ? Math.round(n) : (Math.round(n * 10) / 10));
  };
  const md = (s) => window.YSAI.renderMarkdown(String(s || ''));

  const S = {
    profile: null, data: null, insights: null, ai: null, aiCfg: null, fileName: '',
    facts: null, clusters: null, personalized: null, mode: null, pending: null,
    aiProfile: null,   // profile recomputed on the model's taxonomy
  };
  const C = () => window.YSCharts;

  /* ─────────────────────────── shell ─────────────────────────── */
  function shell(active) {
    return `
      <div class="shell">
        <aside class="side">
          <div class="brand">
            <div class="brand-mark"></div>
            <div class="brand-name">You<em>Scope</em></div>
          </div>
          <nav class="nav" id="nav">
            ${navHTML(active)}
          </nav>
          <div class="side-foot">
            <div class="privacy-note">
              <b>Local only.</b> Your zip is unzipped in this tab. Nothing is uploaded — except an anonymous aggregate summary, and only if you add your own AI key.
            </div>
            <button class="btn ghost sm" id="btn-reset" style="width:100%;justify-content:center">Load different data</button>
          </div>
        </aside>
        <main class="main" id="main"></main>
      </div>`;
  }

  const VIEWS = [
    { id: 'overview', label: 'Overview', kbd: '1' },
    { id: 'interests', label: 'Interests', kbd: '2' },
    { id: 'evolution', label: 'Evolution', kbd: '3' },
    { id: 'rhythm', label: 'Rhythm', kbd: '4' },
    { id: 'channels', label: 'Channels', kbd: '5' },
    { id: 'music', label: 'Music', kbd: '6' },
    { id: 'search', label: 'Searches', kbd: '7' },
    { id: 'portrait', label: 'Portrait', kbd: '8' },
  ];

  function navHTML(active) {
    const icons = {
      overview: '<path d="M3 12h4l2-7 3 14 2-7h5"/>',
      interests: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
      evolution: '<path d="M3 17l5-6 4 3 5-8 4 4"/>',
      rhythm: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
      channels: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 19v2M16 19v2"/>',
      music: '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>',
      portrait: '<path d="M12 3a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 4-6 8-6s8 2 8 6"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
    };
    return VIEWS.map(v => `<a href="#${v.id}" data-view="${v.id}" class="${active === v.id ? 'active' : ''}">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[v.id]}</svg>
      ${v.label}<span class="kbd">${v.kbd}</span></a>`).join('');
  }

  function mount(active) {
    document.body.innerHTML = '<div class="grain"></div>' + shell(active);
    $('#btn-reset').addEventListener('click', () => { resetAll(); });
    $$('#nav a').forEach(a => a.addEventListener('click', (e) => {
      e.preventDefault();
      // Settings must be reachable before any data is loaded.
      if (!S.profile && a.dataset.view !== 'settings') return;
      location.hash = a.dataset.view;
    }));
  }

  /* ─────────────────────────── landing ─────────────────────────── */
  function renderLanding(err) {
    mount('overview');
    const m = $('#main');
    m.innerHTML = `
      <div class="drop-wrap">
        <div class="eyebrow reveal" style="margin-bottom:18px">Belongs to no one but you</div>
        <h1 class="reveal" style="animation-delay:.05s">What your watch history<br>actually says about you.</h1>
        <p class="lede reveal" style="animation-delay:.1s;margin:22px 0 34px">
          Drop your Google Takeout zip. YouScope reads every watch, search and music play,
          then maps your interests, tracks how they shifted year by year, and writes a portrait
          of the person behind the timeline.
        </p>
        ${err ? `<div class="state err reveal" style="animation-delay:.12s;margin-bottom:20px"><h3>${esc(err.title || 'Something went wrong')}</h3><p class="muted">${esc(err.body || '')}</p></div>` : ''}
        <div class="dropzone reveal" id="dz" style="animation-delay:.16s">
          <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
            <path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
          </svg>
          <h2>Drop takeout-*.zip here</h2>
          <p class="lede" style="margin:0 auto 24px">or choose the file — it stays on your device</p>
          <button class="btn" id="btn-file">Choose zip file</button>
          <input type="file" accept=".zip,.html,.csv" id="file" hidden>
          <div id="prog"></div>
        </div>
        <div class="grid g-3 reveal" style="animation-delay:.22s;margin-top:18px">
          <div class="card kpi"><div class="label">Interests</div><div class="value">22<small>categories</small></div><div class="foot">Mapped from channels and titles, no cloud calls</div></div>
          <div class="card kpi"><div class="label">Evolution</div><div class="value">Q<small>by Q</small></div><div class="foot">Persistent vs rising vs fading, per quarter</div></div>
          <div class="card kpi"><div class="label">Portrait</div><div class="value">AI<small>optional</small></div><div class="foot">Bring your own key, or use the built-in writer</div></div>
        </div>
        <p class="hint reveal" style="animation-delay:.24s;margin-top:18px;text-align:center">
          Want the AI portrait too? <a class="link" href="#settings">Connect a model</a> — one key, saved on this machine.
        </p>
        <p class="hint reveal" style="animation-delay:.26s;margin-top:14px;text-align:center">
          How to get the file: <a class="link" href="https://takeout.google.com" target="_blank" rel="noopener">takeout.google.com</a>
          → deselect all → tick <b>YouTube and YouTube Music</b> → format <b>HTML</b> → export.
        </p>
      </div>`;
    wireDropzone();
  }

  function wireDropzone() {
    const dz = $('#dz'), inp = $('#file');
    $('#btn-file').addEventListener('click', () => inp.click());
    inp.addEventListener('change', () => { if (inp.files[0]) start(inp.files[0]); });
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', (e) => {
      const f = e.dataTransfer.files[0];
      if (f) start(f);
    });
  }

  function progress(pct, step) {
    const p = $('#prog');
    if (!p) return;
    if (!p.firstChild) {
      p.className = 'progress';
      p.innerHTML = '<div class="bar"><i></i></div><div class="step"></div>';
    }
    p.querySelector('.bar i').style.width = Math.max(2, pct) + '%';
    p.querySelector('.step').textContent = step;
  }

  /* ─────────────────────────── pipeline ─────────────────────────── */
  /* Upload pipeline, in two halves:
   *   readAndAnalyse() — unzip, parse, profile, facts, clusters. All local.
   *   start()          — runs that, then shows the mode gate.
   * The gate exists so the AI choice is made with real numbers visible
   * ("9,645 videos", "19 clusters found") rather than before uploading. */
  async function readAndAnalyse(file) {
    $('#btn-file').disabled = true;
    progress(4, 'Reading ' + file.name + ' (' + (file.size / 1048576).toFixed(1) + ' MB)');

    let files;
    if (/\.zip$/i.test(file.name)) {
      const buf = await file.arrayBuffer();
      progress(12, 'Opening archive');
      files = await window.YSZip.readTakeoutZip(buf, (name, i, total) => {
        progress(12 + (i / total) * 48, 'Extracting ' + name.split('/').pop());
      });
    } else {
      const text = await file.text();
      files = [{ name: file.name, text }];
    }
    if (!files.length) throw new Error('No readable files found. Is this a YouTube Takeout zip?');

    progress(62, 'Parsing ' + files.length + ' files');
    await tick();
    const data = window.YSTakeout.parseTakeoutFiles(files);
    if (!data.watch.length) {
      throw new Error('Found the archive but no watch history inside. Make sure "YouTube and YouTube Music" was selected, and choose HTML format (not JSON).');
    }

    progress(74, 'Analysing ' + fmt(data.watch.length) + ' watch events');
    await tick();
    const profile = window.YSAnalytics.buildProfile(data, window.YSTaxonomy, { now: Date.now() });

    progress(84, 'Writing the built-in reading');
    await tick();
    const insights = window.YSInsights.build(profile);

    // facts + clusters power the personalised path and inform the gate
    progress(90, 'Finding patterns in your viewing');
    await tick();
    let facts = null, clusters = null;
    try {
      const tz = (profile.timezone && profile.timezone.offsetMin) || 0;
      facts = window.YSFacts.build(data, { tzOffsetMin: tz });
      if (facts) facts.eras = window.YSFacts.eras(facts, data.watch);
      clusters = window.YSCluster.build(data.watch, { maxClusters: 18 });
    } catch (e) { console.warn('facts/clusters unavailable:', e.message); }

    progress(98, 'Ready');
    return { data, profile, insights, facts, clusters, fileName: file.name };
  }

  async function start(file) {
    try {
      const result = await readAndAnalyse(file);
      S.pending = result;
      renderGate();
    } catch (e) {
      console.error(e);
      renderLanding({ title: 'Could not read that file', body: e.message });
    }
  }

  /* Commit the analysed data into app state and persist what is safe to keep.
   * Raw events stay in memory only; the aggregate survives a refresh. */
  function commitPending(mode) {
    const r = S.pending;
    if (!r) return false;
    S.data = r.data;
    S.profile = r.profile;
    S.insights = r.insights;
    S.facts = r.facts;
    S.clusters = r.clusters;
    S.fileName = r.fileName;
    S.mode = mode;
    try {
      sessionStorage.setItem('youscope.profile', JSON.stringify({
        profile: r.profile, insights: r.insights, fileName: r.fileName,
        facts: r.facts, mode,
        dataLight: {
          watch: [],
          search: r.data.search, subscriptions: r.data.subscriptions,
          comments: r.data.comments, playlists: r.data.playlists,
          musicLibrary: r.data.musicLibrary,
        },
      }));
    } catch (e) { /* quota — no reload persistence, fine */ }
    return true;
  }

  /* ── the mode gate ─────────────────────────────────────────── */
  function renderGate() {
    const r = S.pending;
    if (!r) return renderLanding();
    mount('overview');

    const c = r.clusters;
    const f = r.facts;
    const canAi = window.YSsettings ? window.YSsettings.proxyMode() : false;
    const clusterLine = c && c.clusters.length
      ? 'Grouped your viewing into **' + c.clusters.length + ' clusters** by shared vocabulary.'
      : '';
    const factsLine = f
      ? fmt(f.totalWatched) + ' videos · ' + fmt(f.channels) + ' channels · ' +
        (f.eras ? f.eras.length + ' phases' : '') + ' · ' +
        f.longReturns.length + ' channels returned after a long gap'
      : '';

    const m = $('#main');
    m.innerHTML = `
      <div style="max-width:820px;margin:14px auto 0">
        <div class="eyebrow reveal" style="margin-bottom:16px">STEP 2 OF 2 · HOW SHOULD I READ THIS?</div>
        <h1 class="reveal" style="animation-delay:.04s;font-size:clamp(1.9rem,3.4vw,2.9rem)">
          ${esc(r.fileName)}
        </h1>
        <p class="lede reveal" style="animation-delay:.08s;margin:16px 0 8px">${factsLine}</p>
        <p class="hint reveal" style="animation-delay:.1s;margin-bottom:30px">${clusterLine}</p>

        <div class="grid g-2 reveal" style="animation-delay:.14s;gap:14px">
          <button class="tier on" id="gate-ai" style="padding:22px 20px;text-align:left">
            <div class="tier-top"><span class="tier-icon">●</span>
              <span class="tier-name">Personalised</span>
              <span class="tier-badge">recommended</span></div>
            <div class="tier-cost">≈5 API calls · ${canAi ? 'key ready' : 'needs a model'}</div>
            <div class="tier-desc">I read your actual videos, name your interests in your own
              words, and build the report around what is genuinely interesting here.</div>
            <div class="tier-detail">No preset categories · no template sections</div>
          </button>

          <button class="tier" id="gate-instant" style="padding:22px 20px;text-align:left">
            <div class="tier-top"><span class="tier-icon">◐</span>
              <span class="tier-name">Instant</span></div>
            <div class="tier-cost">free · no key · ~2s</div>
            <div class="tier-desc">Charts from the numbers on this device. Uses a fixed set of
              22 categories, so it may not match how you would describe yourself.</div>
            <div class="tier-detail">Nothing leaves the browser</div>
          </button>
        </div>

        <div class="reveal" style="animation-delay:.2s;margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
          <button class="btn" id="gate-go">Continue</button>
          <button class="btn ghost" id="gate-back">Choose a different file</button>
          <span class="hint" id="gate-note"></span>
        </div>

        <p class="hint reveal" style="animation-delay:.24s;margin-top:26px;line-height:1.7">
          Personalised sends your video titles to the model you configured — that is what makes
          the reading specific. Instant never touches the network.
          <a class="link" href="#settings">Change model</a>
        </p>
      </div>`;

    let choice = canAi ? 'ai' : 'instant';
    const aiBtn = $('#gate-ai'), instBtn = $('#gate-instant'), goBtn = $('#gate-go'), note = $('#gate-note');

    const paint = () => {
      aiBtn.classList.toggle('on', choice === 'ai');
      instBtn.classList.toggle('on', choice === 'instant');
      goBtn.textContent = choice === 'ai' ? 'Personalise my report' : 'Show my dashboard';
      note.textContent = choice === 'ai' && !canAi
        ? 'Open this from the local app (node server.mjs) to use a model.'
        : '';
    };
    aiBtn.addEventListener('click', () => { choice = 'ai'; paint(); });
    instBtn.addEventListener('click', () => { choice = 'instant'; paint(); });
    $('#gate-back').addEventListener('click', () => { S.pending = null; renderLanding(); });
    goBtn.addEventListener('click', async () => {
      if (choice === 'ai' && !canAi) { location.hash = '#settings'; return; }
      if (choice === 'instant') {
        commitPending('instant');
        goBtn.disabled = true; goBtn.textContent = 'Building…';
        await tick();
        location.hash = 'overview';
        renderView('overview');
        return;
      }
      commitPending('ai');
      goBtn.disabled = true; goBtn.innerHTML = '<span class="spin"></span> personalising';
      location.hash = 'portrait';
      renderView('portrait', { autorun: 'personal' });
    });
    paint();
  }

  const tick = () => new Promise(r => setTimeout(r, 16));

  /* ─────────────────────────── views ─────────────────────────── */
  function renderView(id, opts) {
    // Settings is reachable before any data is loaded — it is the first thing
    // a new user needs.
    if (id === 'settings') {
      mount('settings');
      $('#nav').innerHTML = navHTML('settings');
      $$('#nav a').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); location.hash = a.dataset.view; }));
      $('#btn-reset').addEventListener('click', resetAll);
      const m = $('#main');
      m.innerHTML = topbar('Connect a model', 'YouScope · settings', [
        { text: window.YSsettings.proxyMode() ? 'local app' : 'opened as file', cls: window.YSsettings.proxyMode() ? 'good' : 'warn' },
      ]);
      const host = h('div');
      m.appendChild(host);
      window.YSsettings.render(host, () => { /* saved; nothing to reload */ });
      window.scrollTo({ top: 0, behavior: 'instant' });
      return;
    }
    if (!S.profile) return renderLanding();
    const p = S.profile;
    mount(id);
    const m = $('#main');
    $('#nav').innerHTML = navHTML(id);
    $$('#nav a').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); location.hash = a.dataset.view; }));
    $('#btn-reset').addEventListener('click', resetAll);

    const views = { overview: viewOverview, interests: viewInterests, evolution: viewEvolution,
      rhythm: viewRhythm, channels: viewChannels, music: viewMusic, search: viewSearch,
      portrait: viewPortrait, settings: viewSettings };
    const prof = (S.aiProfile && ['overview', 'interests', 'evolution'].includes(id))
      ? S.aiProfile : p;
    (views[id] || viewOverview)(m, prof, opts || {});
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function topbar(title, sub, chips) {
    return `<div class="topbar">
      <div>
        <div class="eyebrow" style="margin-bottom:8px">${esc(sub)}</div>
        <h1>${esc(title)}</h1>
      </div>
      <div class="spacer"></div>
      ${(chips || []).map(c => `<span class="chip ${c.cls || ''}">${esc(c.text)}</span>`).join('')}
    </div>`;
  }

  function rangeChip(p) {
    const d = (ms) => new Date(ms).toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' });
    return { text: d(p.range.first) + ' → ' + d(p.range.last) };
  }

  /* ── OVERVIEW ── */
  function viewOverview(m, p) {
    const C = window.YSCharts;
    const monthly = p.monthlySeries;
    const insights = S.insights;
    m.innerHTML = topbar('The shape of your attention', 'YouScope · overview', [
      rangeChip(p),
      { text: fmt(p.counts.watchEvents) + ' watches', cls: 'good' },
      ...(p.taxonomySource === 'ai-taxonomy' ? [{ text: 'your taxonomy', cls: 'good' }] : []),
      { text: p.timezone.label || 'UTC' },
    ]);

    const wrap = h('div');
    m.appendChild(wrap);

    // KPI row
    const kpis = h('div', { class: 'grid g-4 reveal' });
    const sessionsMedian = p.sessions.medianLength;
    [
      ['Videos watched', fmt(p.counts.watchEvents), `${fmt(p.counts.uniqueChannels)} channels · ${p.activity.avgPerActiveDay}/active day`],
      ['Days with activity', fmt(p.activity.activeDays), `longest streak <b>${p.activity.longestStreak}</b> days`],
      ['Music plays', fmt(p.counts.musicPlays), `${(100 * p.counts.musicPlays / p.counts.watchEvents).toFixed(0)}% of everything`],

  function viewEvolution(m, p) {

    const wrap = h('div', { class: 'reveal' });

    // stream graph
    const sc = h('div', { class: 'card' });
    sc.appendChild(h('div', { class: 'card-head' }, `<h3>Interest composition over time</h3><span class="sub">share of quarterly watches · top 9 categories</span>`));
    sc.appendChild(C.streamChart(p.evolution.quarters, p.evolution.trajectories, { h: 300, layers: 9 }));
    const legend = h('div', { class: 'tags', style: 'margin-top:16px' });
    p.evolution.trajectories.slice(0, 9).forEach(t => {
      const tag = h('span', { class: 'tag' });
      tag.innerHTML = `<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${t.color};margin-right:6px"></span>${esc(t.label)}`;
      legend.appendChild(tag);
    });
    sc.appendChild(legend);
    wrap.appendChild(sc);

    // trajectories
    const nQ = p.evolution.quarters.length;
    const shortSpan = nQ < 5;
    const groups = [
      shortSpan
        ? { id: 'steady', title: 'Steady core', cls: 'hot', blurb: `Present throughout, with no strong trend inside this ${nQ}-quarter window. A longer export would separate the truly persistent from the merely current.` }
        : { id: 'persistent', title: 'Persistent — never left', cls: 'hot', blurb: 'Present in every single quarter, and materially so. This is the load-bearing part of your identity.' },
      { id: 'rising', title: 'Rising', cls: 'cool', blurb: 'Grew sharply toward the end of the window.' },
      { id: 'fading', title: 'Fading', cls: 'warm', blurb: 'Peaked earlier and has been declining since.' },
      { id: 'faded', title: 'Gone quiet', cls: '', blurb: 'Dropped to zero after a real presence.' },
    ];
    const g2 = h('div', { class: 'grid g-2', style: 'margin-top:16px' });
    groups.forEach(g => {

  /* Called when the personalised run finishes: rebuild every statistic against
   * the model's grouping and repaint whichever view is open. */
  function adoptTaxonomy(personalized) {
    if (!personalized || !personalized.taxonomy || !S.data) return false;
    try {
      const tz = (S.profile.timezone && S.profile.timezone.offsetMin) || 0;
      const r = window.YSRetax.build(S.data, S.profile, personalized.taxonomy, { tzOffsetMin: tz });
      const base = S.profile;
      S.aiProfile = {
        ...base,
        interests: r.interests,
        evolution: r.evolution,
        taxonomySource: 'ai-taxonomy',
        taxonomyNames: personalized.taxonomy.map((t) => t.name),
      };
      S.personalized = personalized;
      try {
        sessionStorage.setItem('youscope.aiProfile', JSON.stringify({
          aiProfile: S.aiProfile,
          taxonomyNames: S.aiProfile.taxonomyNames,
        }));
      } catch (e) { /* quota */ }
      return true;
    } catch (e) {
      console.warn('could not adopt taxonomy:', e.message);
      return false;
    }
  }

  /* Which profile should the charts use right now? */
  function activeProfile() {
    const id = (location.hash || '#overview').slice(1) || 'overview';
    const aiAware = ['overview', 'interests', 'evolution'];
    return (S.aiProfile && aiAware.includes(id)) ? S.aiProfile : S.profile;
  }

  /* Nudge the user that the numbers just changed underneath them. */
  function flashTaxonomyNotice() {
    const bar = h('div', {
      id: 'tax-notice',
      style: 'position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:9998;' +
        'background:rgba(6,10,8,.97);border:1px solid rgba(125,255,179,.45);border-radius:12px;' +
        'padding:13px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 16px 48px rgba(0,0,0,.6)',
    });
    bar.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:var(--accent);
        box-shadow:0 0 10px var(--accent);flex:0 0 7px"></span>
      <span style="font-size:.86rem">Your interest groups are now the model's, not the presets.
        Charts updated.</span>
      <button class="btn ghost sm" style="padding:5px 10px">See overview</button>
      <button class="btn ghost sm" style="padding:5px 10px;opacity:.7">dismiss</button>`;
    document.body.appendChild(bar);
    const [seeBtn, closeBtn] = bar.querySelectorAll('button');
    seeBtn.addEventListener('click', () => { location.hash = '#overview'; bar.remove(); });
    closeBtn.addEventListener('click', () => bar.remove());
    setTimeout(() => { if (bar.parentNode) bar.remove(); }, 14000);
  }

  /* A small inline note for views that are showing AI-derived numbers. */
  function taxonomyBadge(p) {
    if (!p || p.taxonomySource !== 'ai-taxonomy') return '';
    return `<span class="chip good" title="These numbers use the interest groups the model named for you, not the built-in categories.">your taxonomy</span>`;
  }

  /* ── PORTRAIT (tiered: built-in / digest / full) ── */
  function viewPortrait(m, p, opts) {
    m.innerHTML = topbar('The portrait', 'YouScope · what the data concludes', [
      { text: S.ai && S.ai.source === 'ai-full' ? 'full analysis' : '4 depths', cls: 'good' },
    ]);
    const host = h('div', { class: 'reveal' });
    m.appendChild(host);
    window.YSportrait.render(host, {
      profile: p, data: S.data, insights: S.insights, aiCfg: S.aiCfg,
      facts: S.facts, clusters: S.clusters, autorun: opts && opts.autorun,
      onPersonalized: (result) => {
        if (adoptTaxonomy(result)) {
          flashTaxonomyNotice();
        }
      },
    });
  }

  /* ── SETTINGS ── */
  function viewSettings(m, p) {
    window.YSsettings.render(m, () => {});
  }

  /* ─────────────────────────── boot ─────────────────────────── */
  function resetAll() {
    try { sessionStorage.removeItem('youscope.profile'); } catch (e) {}
    S.profile = null; S.data = null; S.insights = null; S.ai = null;
    location.hash = '';
    renderLanding();
  }

  function boot() {
    S.aiCfg = window.YSAI.loadConfig();

    // restore session (no raw watch events stored — only aggregates)
    let restored = false;
    try {
      const raw = sessionStorage.getItem('youscope.profile');
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved.profile && saved.profile.range && saved.profile.range.first) {
          S.profile = saved.profile;
          S.insights = saved.insights;
          S.facts = saved.facts || null;
          S.mode = saved.mode || null;
          try {
            const aiRaw = sessionStorage.getItem('youscope.aiProfile');
            if (aiRaw) S.aiProfile = JSON.parse(aiRaw).aiProfile || null;
          } catch (e) { /* ignore */ }
          S.data = saved.dataLight || { watch: [], search: [], subscriptions: [], comments: [], playlists: [], musicLibrary: [] };
          S.fileName = saved.fileName || '';
          restored = true;
        }
      }
    } catch (e) { /* ignore */ }

    if (restored) {
      const id = (location.hash || '#overview').slice(1);
      renderView(VIEWS.some(v => v.id === id) ? id : 'overview');
    } else {
      renderLanding();
    }

    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1) || 'overview';
      if (!S.profile) {
        if (id === 'settings') return renderView('settings');
        return;
      }
      if (VIEWS.some(v => v.id === id)) renderView(id);
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      if (!S.profile) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= VIEWS.length && !e.metaKey && !e.ctrlKey) {
        location.hash = VIEWS[n - 1].id;
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* Test/debug hook — lets an automated harness inject a precomputed profile
     without going through the file picker. Harmless in production. */
  window.YouScope = {
    inject(profile, insights, dataLight) {
      S.profile = profile;
      S.insights = insights || window.YSInsights.build(profile);
      S.data = dataLight || { watch: [], search: [], subscriptions: [], comments: [], playlists: [], musicLibrary: [] };
      const id = (location.hash || '#overview').slice(1) || 'overview';
      renderView(VIEWS.some(v => v.id === id) ? id : 'overview');
      return true;
    },
    views: VIEWS.map(v => v.id),
    state: () => S,
  };
})();

</script>
</body>
</html>
