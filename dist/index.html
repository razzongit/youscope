<script>
/* YouScope — personalize.js
 * The model, not the code, decides what this person's interests ARE.
 *
 * Code's job: cluster their actual viewing into vocabulary groups and compute
 * every number. The model's job: name those groups in this person's terms,
 * decide which facts matter, and propose the report's own structure.
 *
 * Nothing here knows what "fitness" or "finance" means.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.YSPersonalize = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function getAI() {
    return (typeof YSAI !== 'undefined' ? YSAI : null)
      || (typeof window !== 'undefined' && window.YSAI)
      || (typeof require === 'function' ? require('./ai.js') : null)
      || (typeof global !== 'undefined' ? global.YSAI : null);
  }

  /* ── 1. Name the clusters ─────────────────────────────────────── */
  function taxonomyPrompt(clusters, meta) {
    const payload = clusters.map((c, i) => ({
      id: i,
      videos: c.count,
      channels: c.channels.slice(0, 4),
      words: c.terms.slice(0, 8),
      examples: c.samples.slice(0, 3).map((t) => String(t).slice(0, 70)),
    }));

    return `A person watched ${meta.total} videos. Their viewing has been grouped by shared vocabulary into the clusters below. The groups are pure arithmetic — nothing about their meaning has been decided yet.

YOUR TASK: name these clusters the way THIS person would describe them. Not textbook categories. If a cluster is "amazon, vcs, job, wfh, salary" then "Amazon employment stories" beats "Career". If it is "haseen, khayaal, gallan, talwiind" then name the actual music scene, not "Music".

CLUSTERS:
${JSON.stringify(payload, null, 1)}

Return JSON:
{
  "taxonomy": [
    {
      "clusterIds": [0, 3],
      "name": "what this person would call it, 2-5 words",
      "definition": "one line: what this body of watching actually is",
      "weight": "primary | secondary | peripheral"
    }
  ],
  "noticed": "one sentence on anything surprising in HOW these clusters relate"
}

Rules:
- Merge clusters that are really one interest. Split nothing — you only have these groups.
- Every cluster id 0-${clusters.length - 1} must appear exactly once across taxonomy.clusterIds.
- Names must come from the actual words and titles shown. Do not import outside categories.
- 4-9 groups. Fewer if the viewing is genuinely narrow.
- If one cluster is a catch-all of unrelated leftovers, name it honestly as such.
- JSON only, no fences.`;
  }

  /* ── 2. Decide what is worth saying ───────────────────────────── */
  function slimFacts(facts) {
    // Keep the fact sheet small enough for a reasoning model to answer quickly.
    const { hours, channelChurn, ...rest } = facts;
    return {
      ...rest,
      longReturns: (rest.longReturns || []).slice(0, 8),
      abandoned: (rest.abandoned || []).slice(0, 10),
      silences: (rest.silences || []).slice(0, 8),
      searchArc: (rest.searchArc || []).map((y) => ({ ...y, samples: y.samples.slice(0, 5) })),
      eras: (rest.eras || []).map((e) => ({ ...e, topChannels: e.topChannels.slice(0, 3) })),
    };
  }

  function structurePrompt(facts, taxonomy) {
    return `Here is a verifiable FACT SHEET about one person's ${facts.spanDays} days of YouTube history, plus the interest groups that emerged from it.

FACTS (every value computed from their data; you may not invent others):
${JSON.stringify(slimFacts(facts), null, 1)}

INTEREST GROUPS (named from their own vocabulary):
${JSON.stringify(taxonomy, null, 1)}

YOUR TASK: decide what is actually interesting about this person, and design the report around it.

Do NOT use generic section names like "Overview", "Interests", "How you changed". Those are templates. Choose the questions that THIS data answers in a way worth reading.

Each section may include a "layout": an ordered list of visuals. Compose from this FIXED set only:

  prose | stat | chart | table | timeline | tags

  chart needs {chart, data}:
    area  + monthlyVolume | searchArc | silence
    bars  + groupTotals | abandoned | longReturns | eras | trajectories
    clock + hours
    heatmap + dailyCounts
    stream + quarterlyShares
  stat needs {facts:[keys]}: totalWatched channels spanDays searches nightShare
    peakHour abandoned longReturns eras coverage
  table / timeline / tags need {data: any chart data key above}

Return JSON:
{
  "headline": "one sentence, under 20 words, the single most striking true thing here",
  "sections": [
    {
      "title": "a specific question or claim, e.g. 'The year the searches stopped'",
      "intent": "what this section establishes",
      "citesFacts": ["fact fields this rests on, e.g. searchArc, silences, longReturns"],
      "layout": [{"type":"chart","chart":"area","data":"searchArc"}]
    }
  ],
  "skip": "one sentence naming something you deliberately did NOT report, and why"
}

Rules:
- 3-6 sections. Every one must rest on at least one named fact field.
- Use 0-3 blocks per section. A block must earn its place: only include one when the shape
  of the data is the point (a trend, a spike, a cluster of dates). Prose alone is often right.
- Match the block to the data. Do not ask for a clock from anything but "hours", or a
  heatmap from anything but "dailyCounts".
- Prefer facts with sharp contrast: returns after long gaps, silences, clusters that shrank,
  arcs that turned.
- If the facts are thin, say fewer things. Do not pad.
- JSON only, no fences.`;
  }

  /* ── 3. Write each section against its assigned facts ────────── */
  function sectionPrompt(section, facts, taxonomy, evidence) {
    return `Write ONE section of a personal report from verifiable data.

SECTION TITLE: ${section.title}
INTENT: ${section.intent}
FACTS IT SHOULD USE: ${JSON.stringify(section.citesFacts)}

FULL FACT SHEET:
${JSON.stringify(slimFacts(facts), null, 1)}

INTEREST GROUPS:
${JSON.stringify(taxonomy, null, 1)}

${evidence ? `SPECIFIC EVIDENCE FOR THIS SECTION:\n${evidence}\n` : ''}
Write 2-4 sentences. Second person. Concrete.

Rules:
- Every sentence must be traceable to a number or name above. If you cannot ground it, cut it.
- Never state a statistic that is not in the fact sheet. Do not round differently than the data does.
- No horoscope phrasing. No advice. No "you should".
- If the evidence is thin, write one honest sentence instead of three padded ones.
- Plain text, no markdown headers, no JSON wrapper.`;
  }

  /* ── orchestrator ─────────────────────────────────────────────── */
  async function run(facts, clusters, cfg, hooks) {
    hooks = hooks || {};
    const onStage = hooks.onStage || (() => {});
    const ai = getAI();
    if (!ai) throw new Error('AI module unavailable.');

    const call = async (prompt, maxTokens, json, label) => {
      const attempt = async (extra) => {
        const r = await ai.chat(cfg, [
          { role: 'system', content: 'You are a precise behavioural analyst. You only state what the data supports.' },
          { role: 'user', content: prompt + (extra || '') },
        ], { json: !!json, maxTokens });
        if (!json) return r.content;
        const parsed = ai.extractJson(r.content);
        if (parsed) return parsed;
        return { __parseFailed: true, __raw: String(r.content || '').slice(0, 300) };
      };

      let out = await attempt('');
      if (json && out && out.__parseFailed) {
        // One retry with an explicit pointer at the format.
        out = await attempt('\n\nReturn ONLY a JSON object. No prose, no markdown fences, no explanation.');
      }
      if (json && out && out.__parseFailed) {
        throw new Error(`The model returned text that was not JSON for "${label}". It said: "${out.__raw.slice(0, 160)}..." — try a model with stronger JSON support.`);
      }
      return out;
    };

    // 1. taxonomy
    onStage('Naming your interest groups');
    const taxOut = await call(taxonomyPrompt(clusters, { total: facts.totalWatched }), 2400, true, 'naming your groups');
    if (!taxOut || !Array.isArray(taxOut.taxonomy)) {
      throw new Error('The model did not return a usable taxonomy. Try a stronger model.');
    }
    const taxonomy = taxOut.taxonomy.map((t) => ({
      name: t.name,
      definition: t.definition,
      weight: t.weight || 'secondary',
      clusters: (t.clusterIds || []).map((id) => clusters[id]).filter(Boolean),
    })).filter((t) => t.clusters.length);

    const counts = taxonomy.map((t) => {
      // Full channel membership is required to recompute the charts on this
      // taxonomy later; only the display copies are trimmed.
      const allChannels = [...new Set(t.clusters.flatMap((c) => c.channels || []))];
      return {
        name: t.name, definition: t.definition, weight: t.weight,
        videos: t.clusters.reduce((n, c) => n + c.count, 0),
        share: +t.clusters.reduce((n, c) => n + c.share, 0).toFixed(1),
        channels: allChannels.slice(0, 8),
        allChannels,
        terms: [...new Set(t.clusters.flatMap((c) => c.terms || []))].slice(0, 10),
      };
    }).sort((a, b) => b.videos - a.videos);

    // 2. structure
    onStage('Deciding what is worth saying');
    let struct = await call(structurePrompt(facts, counts), 2400, true, 'choosing what to report');
    if (!struct || !Array.isArray(struct.sections) || !struct.sections.length) {
      // Degrade rather than fail: keep the taxonomy, which is already useful,
      // and derive sections from the strongest facts we have.
      onStage('Structure step produced nothing usable — deriving sections from the facts');
      const derived = deriveSections(facts);
      struct = { headline: null, sections: derived, skip: null };
    }

    // 3. write sections
    const sections = [];
    for (let i = 0; i < struct.sections.length; i++) {
      const s = struct.sections[i];
      onStage(`Writing ${i + 1} of ${struct.sections.length}: ${s.title}`);
      try {
        const evidence = gatherEvidence(s, facts);
        const body = await call(sectionPrompt(s, facts, counts, evidence), 1200, false, s.title);
        if (body && String(body).trim()) {
          sections.push({
            title: s.title,
            body: String(body).trim(),
            cites: s.citesFacts || [],
            layout: validateLayout(s.layout),
          });
        }
      } catch (e) {
        sections.push({ title: s.title, body: null, error: e.message });
      }
      if (hooks.delayMs) await new Promise((r) => setTimeout(r, hooks.delayMs));
    }

    return {
      source: 'ai-personalized',
      headline: struct.headline || null,
      taxonomy: counts,
      sections: sections.filter((s) => s.body),
      failedSections: sections.filter((s) => !s.body),
      skipped: struct.skip || null,
      noticed: taxOut.noticed || null,
    };
  }

  /* Keep only blocks the renderer can actually draw. The model is composing
   * from a fixed vocabulary, so anything outside it is a bug — drop silently
   * rather than rendering a broken panel. */
  function validateLayout(layout) {
    if (!Array.isArray(layout)) return [];
    return layout.filter((b) => {
      if (!b || typeof b !== 'object') return false;
      const t = String(b.type || '').toLowerCase();
      return ['prose', 'stat', 'chart', 'table', 'timeline', 'tags'].includes(t);
    }).slice(0, 4).map((b) => ({
      type: String(b.type).toLowerCase(),
      chart: b.chart ? String(b.chart).toLowerCase() : undefined,
      data: b.data ? String(b.data) : undefined,
      facts: Array.isArray(b.facts) ? b.facts.filter((x) => typeof x === 'string').slice(0, 4) : undefined,
      limit: b.limit ? Number(b.limit) : undefined,
      caption: b.caption ? String(b.caption).slice(0, 120) : undefined,
    }));
  }

  /* When the model cannot propose a structure, build one from whichever facts
   * are most striking. Ordering is by measurable contrast, not by taste. */
  function deriveSections(facts) {
    const out = [];
    if (facts.longReturns && facts.longReturns.length >= 3) {
      out.push({
        title: `Channels you came back to after ${Math.round(facts.longReturns[0].days / 365 * 10) / 10} years`,
        intent: 'show the returns after long gaps',
        citesFacts: ['longReturns'],
      });
    }
    if (facts.searchArc && facts.searchArc.length) {
      const peak = facts.searchArc.slice().sort((a, b) => b.count - a.count)[0];
      out.push({
        title: `The year you searched ${peak.count} times`,
        intent: 'trace how questions changed',
        citesFacts: ['searchArc'],
      });
    }
    if (facts.abandoned && facts.abandoned.length >= 3) {
      const top = facts.abandoned[0];
      out.push({
        title: `${facts.abandoned.length} channels went quiet`,
        intent: 'name what stopped',
        citesFacts: ['abandoned'],
      });
    }
    if (facts.eras && facts.eras.length >= 2) {
      const big = facts.eras.slice().sort((a, b) => b.watches - a.watches)[0];
      const share = ((100 * big.watches) / Math.max(1, facts.totalWatched)).toFixed(1);
      out.push({
        title: `Where ${share}% of your watching actually happened`,
        intent: 'describe the concentration',
        citesFacts: ['eras'],
      });
    }
    if (facts.silences && facts.silences.length) {
      out.push({
        title: 'The months that went quiet',
        intent: 'describe the gaps',
        citesFacts: ['silences'],
      });
    }
    if (!out.length) {
      out.push({ title: 'What the numbers show', intent: 'summarise', citesFacts: ['totalWatched', 'channels'] });
    }
    return out.slice(0, 5);
  }

  /* Pull the specific rows a section asked for, so the writer sees detail
   * rather than the whole fact sheet every time. */
  function gatherEvidence(section, facts) {
    const wants = (section.citesFacts || []).map((s) => String(s).toLowerCase());
    const lines = [];
    const pick = (key) => wants.some((w) => w.includes(key.toLowerCase()));

    if (pick('return') && facts.longReturns) {
      lines.push('Returns after long gaps: ' + facts.longReturns.map(
        (r) => `${r.channel} came back after ${r.days} days (${r.resumed})`).join('; '));
    }
    if (pick('abandon') && facts.abandoned) {
      lines.push('Channels they stopped: ' + facts.abandoned.slice(0, 8).map(
        (a) => `${a.channel} (${a.watches} videos, last ${a.lastSeen})`).join('; '));
    }
    if (pick('silence') && facts.silences) {
      lines.push('Unusually quiet periods: ' + facts.silences.map(
        (s) => `${s.month} had ${s.count} watches`).join('; '));
    }
    if (pick('search') && facts.searchArc) {
      lines.push('Searches by year: ' + facts.searchArc.map(
        (y) => `${y.year}: ${y.count} searches, e.g. ${(y.samples || []).slice(0, 4).join(' / ')}`).join(' || '));
    }
    if (pick('era') && facts.eras) {
      lines.push('Detected eras: ' + facts.eras.map(
        (e) => `${e.from}–${e.to}: ${e.channelsPerMonth} new channels/month, top groups ${(e.topGroups || []).join(', ')}`).join(' || '));
    }
    if (pick('hour') || pick('rhythm')) {
      lines.push(`Peak hour ${facts.rhythm.peakHour}:00, ${facts.rhythm.nightShare}% after midnight, busiest weekday ${facts.rhythm.busiestWeekday}`);
    }
    if (pick('total') || pick('coverage')) {
      lines.push(`Coverage ${facts.from} to ${facts.to} (${facts.spanDays} days), ${facts.totalWatched} watches across ${facts.channels} channels`);
    }
    return lines.length ? lines.join('\n') : null;
  }

  return { run, taxonomyPrompt, structurePrompt, sectionPrompt, slimFacts, validateLayout };
});

<script>
/* YouScope — retaxonomise.js
 * Recompute every statistic against the model's taxonomy instead of the
 * preset 22 categories.
 *
 * Why this exists: the AI names the person's interests, but the charts were
 * still drawn from taxonomy.js. That made the personalisation cosmetic — the
 * labels changed and the numbers did not. This module makes the AI's grouping
 * the one the charts actually use.
 *
 * Input:  raw events + the model's taxonomy (each group carrying its clusters,
 *         and each cluster carrying its channel list).
 * Output: the same shape analytics.js produces, so views need no rewrite.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.YSRetax = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DAY = 86400000;

  /* Build channel → groupName from the model's taxonomy. */
  /* Accept both shapes:
   *   live run  : [{name, clusters: [{channels: [...]}]}]
   *   saved JSON: [{name, channels: [...], terms: [...]}]
   * Returns channel → group plus a term → group index used as a fallback when
   * the channel list is truncated (a saved report keeps only ~8 per group). */
  function buildIndex(taxonomy) {
    const byChannel = new Map();
    const byTerm = new Map();
    for (const group of taxonomy) {
      const chans = [];
      for (const cluster of (group.clusters || [])) {
        // allChannels is the full membership; channels is the prompt-sized sample.
        chans.push(...(cluster.allChannels || cluster.channels || []));
      }
      chans.push(...(group.allChannels || []));
      chans.push(...(group.channels || []));
      for (const ch of chans) {
        const key = String(ch).replace(/\s*-\s*Topic$/i, '').trim().toLowerCase();
        if (key && !byChannel.has(key)) byChannel.set(key, group.name);
      }
      for (const term of (group.terms || [])) {
        const t = String(term).toLowerCase().trim();
        if (t && !byTerm.has(t)) byTerm.set(t, group.name);
      }
    }
    return { byChannel, byTerm };
  }

  function channelIndex(taxonomy) {
    return buildIndex(taxonomy).byChannel;
  }

  /* Resolve one event to a group: channel first, then title vocabulary. */
  function classifyEvent(e, idx) {
    if (e.channel) {
      const key = String(e.channel).replace(/\s*-\s*Topic$/i, '').trim().toLowerCase();
      if (idx.byChannel.has(key)) return idx.byChannel.get(key);
    }
    if (e.title && idx.byTerm.size) {
      const words = String(e.title).toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length >= 3);
      let best = null, bestHits = 0;
      const seen = new Set();
      for (const w of words) {
        if (seen.has(w)) continue;
        seen.add(w);
        const g = idx.byTerm.get(w);
        if (!g) continue;
        // count how many of this group's terms appear in the title
        let hits = 0;
        for (const x of words) if (idx.byTerm.get(x) === g) hits++;
        if (hits > bestHits) { bestHits = hits; best = g; }
      }
      if (best && bestHits >= 2) return best;
    }
    return null;
  }

  /**
   * Recompute interests, quarterly evolution and trajectories under the AI's
   * grouping.
   *
   * @param data     parsed takeout {watch, search, ...}
   * @param profile  the analytics profile (used for timezone + totals)
   * @param taxonomy the model's groups: [{name, definition, weight, clusters:[{channels}]}]
   * @param opts     {tzOffsetMin}
   */
  function build(data, profile, taxonomy, opts) {
    opts = opts || {};
    const tz = opts.tzOffsetMin !== undefined ? opts.tzOffsetMin
      : ((profile.timezone && profile.timezone.offsetMin) || 0);

    const events = (data.watch || []).filter((e) => !e.ad && e.ts);
    const idx = buildIndex(taxonomy);

    // colour per group — deterministic so re-runs look identical
    const palette = ['#7dffb3', '#ffc46b', '#b39dff', '#6fc7ff', '#ff8a65', '#81c784',
      '#f06292', '#ffd54f', '#4fc3f7', '#ba68c8', '#aed581', '#9575cd'];
    const colour = new Map();
    taxonomy.forEach((g, i) => colour.set(g.name, palette[i % palette.length]));

    const UNMATCHED = 'Everything else';

    /* ── interests ─────────────────────────────────────────────── */
    const catCount = new Map();
    const catChannels = new Map();
    let matched = 0;

    for (const e of events) {
      const hit = classifyEvent(e, idx);
      const group = hit || UNMATCHED;
      if (hit) matched++;
      catCount.set(group, (catCount.get(group) || 0) + 1);
      if (e.channel) {
        if (!catChannels.has(group)) catChannels.set(group, new Map());
        const m = catChannels.get(group);
        const name = String(e.channel).replace(/\s*-\s*Topic$/i, '').trim();
        m.set(name, (m.get(name) || 0) + 1);
      }
    }

    const total = events.length || 1;
    const defByName = new Map(taxonomy.map((g) => [g.name, g.definition]));

    const cats = [...catCount.entries()].map(([name, count]) => ({
      id: name,
      label: name,
      definition: defByName.get(name) || '',
      color: colour.get(name) || '#8a9aa8',
      count,
      share: +((100 * count) / total).toFixed(1),
      topChannels: [...(catChannels.get(name) || new Map()).entries()]
        .sort((a, b) => b[1] - a[1]).slice(0, 5)
        .map(([ch, n]) => ({ name: ch, n })),
    })).sort((a, b) => b.count - a.count);

    const interests = {
      cats,
      classified: matched,
      coverage: +((100 * matched) / total).toFixed(1),
      source: 'ai-taxonomy',
    };

    /* ── evolution by quarter ──────────────────────────────────── */
    const byQ = new Map();
    for (const e of events) {
      const d = new Date(e.ts + tz * 60000);
      const q = d.getUTCFullYear() + '-Q' + (Math.floor(d.getUTCMonth() / 3) + 1);
      if (!byQ.has(q)) byQ.set(q, { total: 0, cats: new Map() });
      const o = byQ.get(q);
      o.total++;
      const hit2 = classifyEvent(e, idx);
      const group = hit2 || UNMATCHED;
      o.cats.set(group, (o.cats.get(group) || 0) + 1);
    }

    const quarters = [...byQ.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([q, o]) => ({
      quarter: q,
      total: o.total,
      cats: [...o.cats.entries()].map(([id, n]) => ({
        id, n, share: +((100 * n) / o.total).toFixed(1),
      })).sort((a, b) => b.n - a.n),
    }));

    /* ── trajectories, same rules as analytics.js ───────────────── */
    const ids = new Set();
    for (const q of quarters) for (const c of q.cats) ids.add(c.id);
    const nQ = quarters.length;
    const trajectories = [...ids].map((id) => {
      const series = quarters.map((q) => {
        const hit = q.cats.find((c) => c.id === id);
        return hit ? hit.share : 0;
      });
      const counts = series.map((s, i) => (s * quarters[i].total) / 100);
      const totalN = Math.round(counts.reduce((a, b) => a + b, 0));
      const active = counts.filter((c) => c > 0).length;
      const firstHalf = counts.slice(0, Math.ceil(nQ / 2)).reduce((a, b) => a + b, 0);
      const secondHalf = counts.slice(Math.floor(nQ / 2)).reduce((a, b) => a + b, 0);

      let trajectory;
      const material = totalN >= 20;
      if (!material) trajectory = 'minor';
      else if (nQ < 5) {
        if (nQ >= 3 && counts[nQ - 1] > counts[0] * 1.8) trajectory = 'rising';
        else if (nQ >= 3 && counts[nQ - 1] * 1.8 < counts[0]) trajectory = 'fading';
        else trajectory = 'steady';
      } else if (active === nQ) trajectory = 'persistent';
      else if (secondHalf > firstHalf * 1.4) trajectory = 'rising';
      else if (secondHalf === 0 && firstHalf > 0) trajectory = 'faded';
      else if (firstHalf > secondHalf * 1.4) trajectory = 'fading';
      else trajectory = 'steady';

      return {
        id, label: id,
        color: colour.get(id) || '#8a9aa8',
        series,
        counts: counts.map((c) => Math.round(c)),
        total: totalN,
        activeQuarters: active,
        trajectory,
      };
    }).sort((a, b) => b.total - a.total);

    return { interests, evolution: { quarters, trajectories }, source: 'ai-taxonomy' };
  }

  /* Convenience: apply the recomputation onto a profile object, returning a
   * new profile so the fixed-taxonomy version stays available for comparison. */
  function applyToProfile(profile, data, taxonomy, opts) {
    const r = build(data, profile, taxonomy, opts);
    return {
      ...profile,
      interests: r.interests,
      evolution: r.evolution,
      taxonomySource: 'ai-taxonomy',
    };
  }

  return { build, applyToProfile, channelIndex, buildIndex, classifyEvent };
});

/* YouScope — zip.js
 * Minimal ZIP reader for Takeout exports (stored + deflate), browser & Node.
 * Depends on fflate's inflateSync when available; falls back to DecompressionStream
 * in browsers, and Node zlib elsewhere.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.YSZip = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // find End of Central Directory
  function findEocd(buf) {
    const min = Math.max(0, buf.length - 65557);
    for (let i = buf.length - 22; i >= min; i--) {
      if (buf[i] === 0x50 && buf[i + 1] === 0x4b && buf[i + 2] === 0x05 && buf[i + 3] === 0x06) return i;
    }
    return -1;
  }

  async function inflateRaw(data) {
    if (typeof fflate !== 'undefined' && fflate.inflateSync) {
      return fflate.inflateSync(data); // sync path (bundled)
    }
    if (typeof DecompressionStream !== 'undefined') {
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([data]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    if (typeof require === 'function') {
      const zlib = require('zlib');
      return new Uint8Array(zlib.inflateRawSync(Buffer.from(data)));
    }
    throw new Error('No inflate implementation available');
  }

  /**
   * Read a Takeout zip. Returns [{name, text}] for text entries (html/csv/json),
   * skipping media binaries. onFile(name, index, total) for progress.
   */
  async function readTakeoutZip(buf, onFile) {
    buf = new Uint8Array(buf);
    const eocd = findEocd(buf);
    if (eocd < 0) throw new Error('Not a zip file (no End-of-Central-Directory found).');
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let entryCount = dv.getUint16(eocd + 10, true);
    let ptr = dv.getUint32(eocd + 16, true);

    // ZIP64 support: EOCD may carry 0xFFFF/0xFFFFFFFF placeholders → zip64 locator
    const z64loc = eocd - 20;
    if (z64loc >= 0 && dv.getUint32(z64loc, true) === 0x07064b50) {
      const z64eocd = Number(dv.getBigUint64(z64loc + 8, true));
      if (dv.getUint32(z64eocd, true) === 0x06064b50) {
        entryCount = Number(dv.getBigUint64(z64eocd + 32, true));
        ptr = Number(dv.getBigUint64(z64eocd + 48, true));
      }
    }

    const files = [];
    for (let i = 0; i < entryCount; i++) {
      if (dv.getUint32(ptr, true) !== 0x02014b50) break; // central dir header
      const method = dv.getUint16(ptr + 10, true);
      let compSize = dv.getUint32(ptr + 20, true);
      let uncompSize = dv.getUint32(ptr + 24, true);
      const nameLen = dv.getUint16(ptr + 28, true);
      const extraLen = dv.getUint16(ptr + 30, true);
      const commentLen = dv.getUint16(ptr + 32, true);
      let localOff = dv.getUint32(ptr + 42, true);
      const name = new TextDecoder().decode(buf.subarray(ptr + 46, ptr + 46 + nameLen));

      // parse zip64 extra field (id 0x0001) for any placeholder values
      if (compSize === 0xFFFFFFFF || uncompSize === 0xFFFFFFFF || localOff === 0xFFFFFFFF || extraLen > 0) {
        let ep = ptr + 46 + nameLen;
        const epEnd = ep + extraLen;
        while (ep + 4 <= epEnd) {
          const hid = dv.getUint16(ep, true);
          const hsz = dv.getUint16(ep + 2, true);
          if (hid === 0x0001) {
            let hp = ep + 4;
            if (uncompSize === 0xFFFFFFFF && hp + 8 <= epEnd) { uncompSize = Number(dv.getBigUint64(hp, true)); hp += 8; }
            if (compSize === 0xFFFFFFFF && hp + 8 <= epEnd) { compSize = Number(dv.getBigUint64(hp, true)); hp += 8; }
            if (localOff === 0xFFFFFFFF && hp + 8 <= epEnd) { localOff = Number(dv.getBigUint64(hp, true)); hp += 8; }
          }
          ep += 4 + hsz;
        }
      }
      ptr += 46 + nameLen + extraLen + commentLen;

      if (localOff >= buf.length || localOff + 30 > buf.length) continue;
      // local header: skip name+extra there too (may differ)
      if (dv.getUint32(localOff, true) !== 0x04034b50) continue;
      const lNameLen = dv.getUint16(localOff + 26, true);
      const lExtraLen = dv.getUint16(localOff + 28, true);
      const dataStart = localOff + 30 + lNameLen + lExtraLen;
      if (dataStart + compSize > buf.length) continue;
      const comp = buf.subarray(dataStart, dataStart + compSize);

      onFile && onFile(name, i, entryCount);
      if (/\.(html?|csv|json|txt)$/i.test(name) && compSize > 0) {
        let bytes;
        if (method === 0) bytes = comp;
        else if (method === 8) bytes = await inflateRaw(comp);
        else continue;
        files.push({ name, text: new TextDecoder('utf-8').decode(bytes) });
      }
    }
    return files;
  }

  return { readTakeoutZip };
});

/* YouScope — charts.js
 * Hand-rolled SVG charts. No dependencies, works offline, prints well.
 */
(function (root) {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, kids) => {
    const n = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) { if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]); }
    if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(k => k && n.appendChild(k));
    return n;

  let TIP = null;

    if (!TIP) { TIP = document.createElement('div'); TIP.id = 'tip'; document.body.appendChild(TIP); }
    return TIP;
  }
  function showTip(e, html) {
    const t = tip();
    t.innerHTML = html; t.classList.add('on');
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY - 34;
    const r = t.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
    if (y < 8) y = e.clientY + 18;
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }
  function hideTip() { if (TIP) TIP.classList.remove('on'); }

  function fmt(n) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n * 10) / 10);
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * p;
  }

  /* ── area/line chart ───────────────────────────────────────────
   * data: [{label, value}]  opts: {h, color, area, labels, yTicks, fmtVal}
   */
  function areaChart(data, opts) {
    opts = opts || {};
    const W = opts.w || 900, H = opts.h || 220;
    const P = { t: 14, r: 12, b: 26, l: 42 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const max = niceMax(Math.max(...data.map(d => d.value), 1));
    const n = data.length;
    const x = i => P.l + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
    const y = v => P.t + ih - (v / max) * ih;
    const color = opts.color || 'var(--accent)';
    const gid = 'g' + Math.random().toString(36).slice(2, 8);

    const svg = el('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img' });

    // grid + y labels
    const ticks = opts.yTicks || 3;
    for (let i = 0; i <= ticks; i++) {
      const v = (max / ticks) * i;
      svg.appendChild(el('line', { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v), class: 'grid-line' }));
      const t = el('text', { x: P.l - 8, y: y(v) + 3, 'text-anchor': 'end', class: 'axis-label' });
      t.appendChild(txt(fmt(v))); svg.appendChild(t);
    }

    const pts = data.map((d, i) => [x(i), y(d.value)]);
    if (opts.area !== false) {
      const defs = el('defs', null, el('linearGradient', { id: gid, x1: '0', y1: '0', x2: '0', y2: '1' },
        [el('stop', { offset: '0', 'stop-color': color, 'stop-opacity': '.34' }),
         el('stop', { offset: '1', 'stop-color': color, 'stop-opacity': '0' })]));
      svg.appendChild(defs);
      const d = `M ${pts[0][0]} ${P.t + ih} ` + pts.map(p => `L ${p[0]} ${p[1]}`).join(' ') + ` L ${pts[pts.length - 1][0]} ${P.t + ih} Z`;
      svg.appendChild(el('path', { d, fill: `url(#${gid})` }));
    }
    svg.appendChild(el('path', {
      d: 'M ' + pts.map(p => `${p[0]} ${p[1]}`).join(' L '),
      fill: 'none', stroke: color, 'stroke-width': '1.6', 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));

    const every = Math.max(1, Math.floor(n / 60));
    pts.forEach((p, i) => {
      if (i % every !== 0 && i !== n - 1) return;
      svg.appendChild(el('circle', { cx: p[0], cy: p[1], r: '1.7', fill: color, opacity: '.85' }));
    });

    const stepL = Math.max(1, Math.ceil(n / (opts.xTicks || 8)));
    data.forEach((d, i) => {
      if (i % stepL !== 0 && i !== n - 1) return;
      const t = el('text', { x: x(i), y: H - 7, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle', class: 'axis-label' });
      t.appendChild(txt(lab[i] !== undefined ? lab[i] : d.label)); svg.appendChild(t);

    const vline = el('line', { y1: P.t, y2: P.t + ih, stroke: color, 'stroke-width': '1', opacity: '0', 'stroke-dasharray': '3 3' });
    const vdot = el('circle', { r: '3.6', fill: color, opacity: '0' });

    hover.addEventListener('mousemove', (e) => {
      const box = svg.getBoundingClientRect();
      const rel = (e.clientX - box.left) / box.width * W;
      let i = Math.round(((rel - P.l) / iw) * (n - 1));

      const d = data[i];
      vline.setAttribute('x1', x(i)); vline.setAttribute('x2', x(i)); vline.setAttribute('opacity', '.5');
      vdot.setAttribute('cx', x(i)); vdot.setAttribute('cy', y(d.value)); vdot.setAttribute('opacity', '1');
      showTip(e, `${lab[i] !== undefined ? lab[i] : d.label} · <b style="color:${color}">${fmt(d.value)}</b>${opts.unit ? ' ' + opts.unit : ''}`);

  /* ── horizontal bars ────────────────────────────────────────── */

    const wrap = document.createElement('div');
    wrap.className = 'bars';
    const max = Math.max(...items.map(i => i.count || i.value || 0), 1);
    items.forEach((it, idx) => {

      row.className = 'brow';
      const track = document.createElement('div');
      track.className = 'track';
      const fill = document.createElement('div');
      fill.className = 'fill' + (opts.alt ? ' alt' : '');
      fill.style.width = Math.max(1.2, (v / max) * 100) + '%';
      if (it.color) { fill.style.background = `linear-gradient(90deg, ${it.color}55, ${it.color}18)`; }
      const nm = document.createElement('div'); nm.className = 'nm';

      row.appendChild(track); row.appendChild(ct);
      if (it.url) { row.style.cursor = 'pointer'; row.addEventListener('click', () => window.open(it.url, '_blank')); }
      wrap.appendChild(row);

  /* ── calendar heatmap ───────────────────────────────────────── */
  function heatmap(dailyCounts, opts) {

    const rIn = 56, rOut = 128;

      const a0 = (h / 24) * Math.PI * 2 - Math.PI / 2;

      const x2 = cx + Math.cos(a1) * len, y2 = cy + Math.sin(a1) * len;
      const x3 = cx + Math.cos(a1) * rIn, y3 = cy + Math.sin(a1) * rIn;
      const p = el('path', {
        d: `M ${x0} ${y0} L ${x1} ${y1} A ${len} ${len} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${rIn} ${rIn} 0 0 0 ${x0} ${y0} Z`,
        fill: opts.color || 'var(--accent)', opacity: (0.22 + 0.78 * (v / max)).toFixed(2),
        style: 'transition:opacity .2s',
      });
      p.addEventListener('mousemove', (e) => showTip(e, `${String(h).padStart(2, '0')}:00 · <b>${v}</b> watches`));
      p.addEventListener('mouseleave', hideTip);
      svg.appendChild(p);
    });
    // hour ticks 0,6,12,18
    [0, 6, 12, 18].forEach(h => {
      const a = (h / 24) * Math.PI * 2 - Math.PI / 2;
      const t = el('text', {
        x: cx + Math.cos(a) * (rOut + 16), y: cy + Math.sin(a) * (rOut + 16) + 3,
        'text-anchor': 'middle', class: 'axis-label',
      });
      t.appendChild(txt(String(h).padStart(2, '0'))); svg.appendChild(t);

  /* ── streamgraph (interest evolution) ───────────────────────── */
  function streamChart(quarters, trajectories, opts) {
    opts = opts || {};

    const P = { t: 12, r: 8, b: 24, l: 8 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const n = quarters.length;
    if (!n) return el('svg');
    const top = trajectories.slice(0, opts.layers || 9);
    // compute per-quarter totals per layer as share
    const layerVals = top.map(t => quarters.map(q => {
      const hit = q.cats.find(c => c.id === t.id);
      return hit ? hit.share : 0;
    }));
    const colTotals = quarters.map((q, i) => layerVals.reduce((s, l) => s + l[i], 0) || 1);
    const x = i => P.l + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
    const scale = ih / 100;
    const svg = el('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' });

    // y-axis: cumulative share of the top-N layers (0 → top-N total, usually ~100)
    for (let pct = 0; pct <= 100; pct += 25) {
      const yy = P.t + ih - pct * scale;
      if (yy < P.t - 1) break;
      svg.appendChild(el('line', { x1: P.l, x2: W - P.r, y1: yy, y2: yy, class: 'grid-line' }));
      const t = el('text', { x: P.l + 2, y: yy - 3, class: 'axis-label', style: 'font-size:8.5px' });
      t.appendChild(txt(pct + '%')); svg.appendChild(t);
    }

    // stacked (non-centered) area bands
    const cum = quarters.map(() => 0);
    for (let li = 0; li < layerVals.length; li++) {
      const vals = layerVals[li];
      const upper = vals.map((v, i) => cum[i] + v);
      const dTop = vals.map((v, i) => `${x(i)} ${P.t + ih - upper[i] * scale}`);
      const dBot = vals.map((v, i) => `${x(i)} ${P.t + ih - cum[i] * scale}`).reverse();
      const d = 'M ' + dTop.join(' L ') + ' L ' + dBot.join(' L ') + ' Z';
      const path = el('path', { d, fill: top[li].color, opacity: '.62', stroke: 'rgba(0,0,0,.3)', 'stroke-width': '.6' });
      path.addEventListener('mousemove', (e) => showTip(e, `<b style="color:${top[li].color}">${top[li].label}</b> · ${vals.map(v => v.toFixed(1)).slice(-1)[0]}% latest`));
      path.addEventListener('mouseleave', hideTip);
      svg.appendChild(path);
      for (let i = 0; i < n; i++) cum[i] += vals[i];
    }
    // x labels — years for long spans, quarters for short ones
    if (n <= 6) {
      quarters.forEach((q, i) => {
        const t = el('text', {
          x: x(i), y: H - 5,
          'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle',
          class: 'axis-label', style: 'font-size:8.5px',
        });
        t.appendChild(txt(q.quarter.replace('-', ' '))); svg.appendChild(t);
      });
    } else {
      let lastY = '';
      quarters.forEach((q, i) => {
        const y = q.quarter.split('-')[0];
        if (y !== lastY) {
          const t = el('text', { x: x(i), y: H - 5, 'text-anchor': 'start', class: 'axis-label' });
          t.appendChild(txt(y)); svg.appendChild(t); lastY = y;
        }
      });
    }
    return svg;
  }

  /* ── radial gauge ───────────────────────────────────────────── */
  function gauge(value, opts) {
    opts = opts || {};
    const W = 160, H = 100, cx = 80, cy = 88, r = 62;
    const pct = Math.max(0, Math.min(1, value));
    const a0 = Math.PI, a1 = Math.PI + Math.PI * pct;
    const svg = el('svg', { class: 'chart chart-fixed', viewBox: `0 0 ${W} ${H}`, style: 'max-width:190px' });
    svg.appendChild(el('path', {
      d: `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`,
      fill: 'none', stroke: 'rgba(255,255,255,.08)', 'stroke-width': '9', 'stroke-linecap': 'round',
    }));
    if (pct > 0.01) {
      svg.appendChild(el('path', {
        d: `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + Math.cos(a1 - Math.PI) * -r * -1} ${cy + Math.sin(a1 - Math.PI) * r}`,
        fill: 'none', stroke: opts.color || 'var(--accent)', 'stroke-width': '9', 'stroke-linecap': 'round',
        style: 'filter:drop-shadow(0 0 6px rgba(125,255,179,.4))',
      }));
    }
    const t = el('text', { x: cx, y: cy - 14, 'text-anchor': 'middle', class: 'axis-label', style: 'font-size:22px;fill:var(--text)' });
    t.appendChild(txt(opts.text || Math.round(pct * 100) + '%')); svg.appendChild(t);
    const s = el('text', { x: cx, y: cy + 1, 'text-anchor': 'middle', class: 'axis-label' });
    s.appendChild(txt(opts.label || '')); svg.appendChild(s);
    return svg;
  }

  root.YSCharts = { areaChart, barRows, heatmap, clockRing, streamChart, gauge, fmt, showTip, hideTip };
})(typeof self !== 'undefined' ? self : this);

<script>
/* YouScope — blocks.js
 * A block is one visual unit a section can render. The model composes sections
 * from this fixed vocabulary; it cannot invent widgets.
 *
 * Safety model:
 *   - The model may only name a block type and reference a fact field.
 *   - Every block declares which data shapes it accepts; a mismatched request
 *     is DOWNGRADED to something renderable (gauge on a series becomes bars)
 *     rather than rendering broken. Validation happens before paint.
 *   - The model never supplies numbers. All values come from facts / profile.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.YSBlocks = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const h = (tag, attrs, html) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'style') n.style.cssText = attrs[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }
    if (html !== undefined && html !== null) n.innerHTML = html;
    return n;
  };
  const esc = (s) => String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const C = () => window.YSCharts;

  /* ── data resolvers: fact-field name → renderable rows ────────── */
  const RESOLVERS = {
    /* volume over time */
    monthlyVolume(ctx) {
      const ms = (ctx.profile && ctx.profile.monthlySeries) || [];
      return ms.map((m) => ({ label: m.month, value: m.count }));
    },
    /* per-group totals */
    groupTotals(ctx) {
      const cats = (ctx.taxonomyGroups || []).length
        ? ctx.taxonomyGroups
        : ((ctx.profile && ctx.profile.interests && ctx.profile.interests.cats) || []);
      return cats.slice(0, 12).map((c) => ({ name: c.label, count: c.count, color: c.color }));
    },
    /* grouped evolution over quarters */
    quarterlyShares(ctx) {
      const q = (ctx.profile && ctx.profile.evolution && ctx.profile.evolution.quarters) || [];
      return q;
    },
    trajectories(ctx) {
      return (ctx.profile && ctx.profile.evolution && ctx.profile.evolution.trajectories) || [];
    },
    /* channel abandonment, as dated points */
    abandoned(ctx) {
      return ((ctx.facts && ctx.facts.abandoned) || []).map((a) => ({
        name: a.channel, count: a.watches, when: a.lastSeen,
      }));
    },
    longReturns(ctx) {
      return ((ctx.facts && ctx.facts.longReturns) || []).map((r) => ({
        name: r.channel, count: r.days, when: r.resumed,
      }));
    },
    /* searches by year */
    searchArc(ctx) {
      return ((ctx.facts && ctx.facts.searchArc) || []).map((y) => ({
        label: String(y.year), value: y.count,
      }));
    },
    /* hours histogram */
    hours(ctx) {
      return (ctx.profile && ctx.profile.clock && ctx.profile.clock.hours) || [];
    },
    /* monthly watch counts for a heatmap */
    dailyCounts(ctx) {
      return (ctx.profile && ctx.profile.dailyCounts) || [];
    },
    eras(ctx) {
      return ((ctx.facts && ctx.facts.eras) || []).map((e) => ({
        name: e.from + ' → ' + e.to, count: e.watches, detail: e.topChannels.join(', '),
      }));
    },
    silence(ctx) {
      return ((ctx.facts && ctx.facts.silences) || []).map((s) => ({
        label: s.month, value: s.count,
      }));
    },
  };

  /* What each fact field can actually be drawn as. Used to downgrade a bad
   * request instead of failing. */
  const SHAPES = {
    monthlyVolume: 'series', searchArc: 'series', silence: 'series',
    hours: 'histogram', dailyCounts: 'calendar',
    groupTotals: 'bars', trajectories: 'bars', abandoned: 'bars',
    longReturns: 'bars', eras: 'bars',
    quarterlyShares: 'stack',
  };

  const AVAILABLE = Object.keys(RESOLVERS);

  /* ── renderers ───────────────────────────────────────────────── */
  const RENDER = {
    prose(spec, ctx) {
      const body = spec.text || ctx.body || '';
      if (!body) return null;
      return h('p', { class: 'narr', style: 'margin:0 0 4px' }, esc(body).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'));
    },

    stat(spec, ctx) {
      const rows = [];
      for (const key of (spec.facts || [])) {
        const v = statValue(key, ctx);
        if (v) rows.push(v);
      }
      if (!rows.length) return null;
      const grid = h('div', { style: 'display:flex;gap:26px;flex-wrap:wrap;margin:2px 0' });
      rows.slice(0, 4).forEach((r) => {
        grid.appendChild(h('div', {}, `<div class="mono" style="font-size:1.5rem;letter-spacing:-.02em;color:var(--text)">${esc(r.value)}</div>
          <div class="hint" style="margin-top:2px">${esc(r.label)}</div>`));
      });
      return grid;
    },

    tags(spec, ctx) {
      let items = [];
      if (spec.data === 'channels' && ctx.blockChannels) items = ctx.blockChannels;
      else if (spec.data === 'terms' && ctx.blockTerms) items = ctx.blockTerms;
      else if (spec.data && RESOLVERS[spec.data]) {
        items = RESOLVERS[spec.data](ctx).slice(0, spec.limit || 12).map((x) => x.name || x.label);
      }
      if (!items || !items.length) return null;
      const wrap = h('div', { class: 'tags', style: 'margin:2px 0' });
      items.slice(0, spec.limit || 12).forEach((t) => wrap.appendChild(h('span', { class: 'tag' }, esc(t))));
      return wrap;
    },

    table(spec, ctx) {
      const res = RESOLVERS[spec.data];
      if (!res) return null;
      const rows = res(ctx).slice(0, spec.limit || 8);
      if (!rows.length) return null;
      const t = h('div', { style: 'font-size:.84rem' });
      rows.forEach((r, i) => {
        t.appendChild(h('div', {
          style: 'display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:6px 0;' +
            (i < rows.length - 1 ? 'border-bottom:1px solid rgba(255,255,255,.05)' : ''),
        }, `<span class="mono dim" style="font-size:.7rem">${i + 1}</span>
            <span>${esc(r.name || r.label || '')}</span>
            <span class="mono dim" style="font-size:.75rem">${esc(r.when || r.count || r.value || '')}</span>`));
      });
      return t;
    },

    timeline(spec, ctx) {
      const res = RESOLVERS[spec.data];
      if (!res) return null;
      const rows = res(ctx).filter((r) => r.when).slice(0, spec.limit || 10);
      if (rows.length < 2) return null;
      const dates = rows.map((r) => Date.parse(r.when)).filter(Number.isFinite);
      if (dates.length < 2) return null;
      const min = Math.min(...dates), max = Math.max(...dates);
      const span = Math.max(1, max - min);

      const box = h('div', { style: 'position:relative;height:56px;margin:16px 0 8px' });
      box.appendChild(h('div', {
        style: 'position:absolute;left:0;right:0;top:26px;height:1px;background:rgba(255,255,255,.13)',
      }));
      rows.forEach((r) => {
        const t = Date.parse(r.when);
        if (!Number.isFinite(t)) return;
        const pct = ((t - min) / span) * 100;
        const dot = h('div', {
          title: r.name + ' — ' + r.when,
          style: `position:absolute;left:${pct}%;top:20px;width:2px;height:13px;background:var(--accent);` +
            'border-radius:1px;opacity:.85;transform:translateX(-1px)',
        });
        box.appendChild(dot);
      });
      const labels = h('div', {
        style: 'display:flex;justify-content:space-between;font-family:var(--mono);font-size:.66rem;color:var(--text-dim)',
      }, `<span>${esc(new Date(min).toISOString().slice(0, 7))}</span><span>${esc(new Date(max).toISOString().slice(0, 7))}</span>`);
      const wrap = h('div');
      wrap.appendChild(box); wrap.appendChild(labels);
      return wrap;
    },

    chart(spec, ctx) {
      let kind = spec.chart;
      let data = spec.data;
      const shape = SHAPES[data];
      if (!shape) return null;

      // Downgrade impossible combinations rather than rendering nonsense.
      const ok = {
        series: ['area'],
        histogram: ['clock'],
        calendar: ['heatmap'],
        bars: ['bars'],
        stack: ['stream'],
      }[shape];
      if (!ok.includes(kind)) {
        kind = ok[0];
        spec = { ...spec, downgradedFrom: spec.chart, chart: kind };
      }

      const res = RESOLVERS[data];
      const rows = res(ctx);
      if (!rows.length) return null;

      if (kind === 'area') {
        const items = rows.map((r) => ({ label: r.label, value: r.value }));
        if (items.length < 3) return null;
        return C().areaChart(items, { h: 150, color: 'var(--accent)', xTicks: 6 });
      }
      if (kind === 'bars') {
        const items = rows.filter((r) => (r.count || r.value)).map((r) => ({
          name: r.name || r.label, count: r.count || r.value, color: r.color,
        }));
        if (items.length < 2) return null;
        return C().barRows(items.slice(0, 10), {});
      }
      if (kind === 'clock') {
        if (rows.length !== 24) return null;
        return C().clockRing(rows, { color: 'var(--accent)', centerTop: '', centerBottom: 'watches' });
      }
      if (kind === 'heatmap') {
        if (rows.length < 20) return null;
        return C().heatmap(rows);
      }
      if (kind === 'stream') {
        const q = rows;
        if (q.length < 4) return null;
        return C().streamChart(q, (ctx.profile.evolution && ctx.profile.evolution.trajectories) || q, { h: 170, layers: 6 });
      }
      return null;
    },
  };

  function statValue(key, ctx) {
    const f = ctx.facts || {};
    const p = ctx.profile || {};
    const map = {
      totalWatched: () => ({ value: nf(f.totalWatched), label: 'videos watched' }),
      channels: () => ({ value: nf(f.channels), label: 'channels' }),
      spanDays: () => ({ value: nf(f.spanDays), label: 'days covered' }),
      searches: () => ({ value: nf(f.searches), label: 'searches' }),
      nightShare: () => ({ value: (f.rhythm ? f.rhythm.nightShare + '%' : ''), label: 'after midnight' }),
      peakHour: () => ({ value: f.rhythm ? String(f.rhythm.peakHour).padStart(2, '0') + ':00' : '', label: 'peak hour' }),
      abandoned: () => ({ value: nf((f.abandoned || []).length), label: 'channels went quiet' }),
      longReturns: () => ({ value: nf((f.longReturns || []).length), label: 'came back after a gap' }),
      eras: () => ({ value: nf((f.eras || []).length), label: 'phases detected' }),
      coverage: () => ({ value: (p.interests ? p.interests.coverage + '%' : ''), label: 'grouped' }),
    };
    const fn = map[key];
    const v = fn ? fn() : null;
    return v && v.value && v.value !== 'undefined' && v.value !== 'NaN' ? v : null;
  }
  const nf = (n) => (typeof n === 'number' ? n.toLocaleString() : String(n || ''));

  /* ── public: validate a spec, then paint ─────────────────────── */
  function normalise(spec) {
    if (!spec || typeof spec !== 'object') return null;
    const type = String(spec.type || '').toLowerCase();
    if (!RENDER[type]) return null;
    const out = { type };
    if (spec.data) {
      if (!AVAILABLE.includes(spec.data)) return null;   // unknown fact field
      out.data = spec.data;
    }
    if (spec.chart) out.chart = String(spec.chart).toLowerCase();
    if (Array.isArray(spec.facts)) out.facts = spec.facts.filter((k) => typeof k === 'string');
    if (spec.text) out.text = String(spec.text).slice(0, 1200);
    if (spec.limit) out.limit = Math.max(1, Math.min(24, Number(spec.limit) || 8));
    return out;
  }

  /** Render one block. Returns null when it cannot be drawn at all. */
  function render(spec, ctx) {
    const s = normalise(spec);
    if (!s) return null;
    try {
      return RENDER[s.type](s, ctx) || null;
    } catch (e) {
      console.warn('block render failed:', s.type, e.message);
      return null;
    }
  }

  /** Render a section: prose first if given, then its blocks. */
  function renderSection(section, ctx) {
    const wrap = h('div');
    const prose = render({ type: 'prose', text: section.body }, ctx);
    if (prose) wrap.appendChild(prose);

    for (const spec of (section.layout || [])) {
      const el = render(spec, ctx);
      if (el) {
        const holder = h('div', { style: 'margin-top:14px' });
        holder.appendChild(el);
        if (spec.caption) {
          holder.appendChild(h('div', { class: 'hint', style: 'margin-top:6px;font-size:.72rem' }, esc(spec.caption)));
        }
        wrap.appendChild(holder);
      }
    }
    return wrap;
  }

  return { render, renderSection, normalise, AVAILABLE, SHAPES };
});

/* YouScope — portrait.js
 * The Portrait view: tiered analysis (built-in / digest / full personal).
 * Extracted from app.js because the consent + progress UI is substantial.
 */
(function (root) {
  'use strict';

  const h = (tag, attrs, html) => {

    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'style') n.style.cssText = attrs[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }

  };

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const md = (s) => window.YSAI.renderMarkdown(String(s || ''));

  function render(container, ctx) {

    MODE = 'personal';
    LAST = null;

    picker.appendChild(h('div', { class: 'card-head' },
      `<h3>How deep</h3><span class="sub">pick your level</span>`));

        desc: 'Written from the numbers on your device. Nothing leaves the browser.',
        detail: '5 sections · fixed categories, hours, trajectories',
      },

        id: 'personal', name: 'Personalised', cost: '≈5 API calls', icon: '●',
        desc: 'The model names your interest groups from your own vocabulary and decides what is worth reporting.',
        detail: 'No preset categories · no template sections · every fact cited',

      },

        desc: 'A model reads the summary statistics and writes the portrait.',

  function selectTier(id, container, ctx, silent) {
